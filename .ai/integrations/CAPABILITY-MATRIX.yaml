        "scope",
        "window",
        "unit",
        "limit",
        "remaining",
        "reset_at",
        "region",
        "principal",
        "account_tier",
        "discovery_method"
      ],
      "asynchronous_operation": [
        "submission_mode",
        "provider_operation_id",
        "status_polling",
        "webhook_reconciliation",
        "terminal_states"
      ],
      "media": [
        "kind",
        "mime_types",
        "count",
        "size",
        "duration",
        "dimensions",
        "upload_session_expiry"
      ],
      "publication": [
