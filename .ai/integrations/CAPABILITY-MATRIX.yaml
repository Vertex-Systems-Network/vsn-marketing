  "rules": [
    "A connector advertises only capabilities proven by implementation and contract tests.",
    "Unknown is never treated as supported; callers fail closed or choose an explicitly compatible alternative.",
    "Capability support and connection readiness are separate facts: technically supported does not imply the current connection may use the capability in production.",
    "Volatile limits, scopes, roles, provider-review status, versions and policy constraints are refreshable provenance-stamped metadata rather than permanent hard-coded product truth.",
    "Provider-name conditionals are forbidden in core business logic when a capability/readiness dimension can express the behavior."
  ]
}
