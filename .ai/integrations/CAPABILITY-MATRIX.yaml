  "schema_version": 2,
  "capability_model": {
    "support_states": [
      "supported",
      "unsupported",
      "unknown"
    ],
    "readiness_states": [
      "unconfigured",
      "configuration_required",
      "sandbox_only",
      "private_only",
      "review_required",
      "ready",
      "suspended",
      "deprecated"
    ],
