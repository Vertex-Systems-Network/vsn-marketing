      "text": "Default-branch rules/status enforcement is verified and documented for required checks, single-owner merge safety and privileged workflow changes. Because this repository is intentionally single-maintainer, required approving reviews and last-push approval are not acceptance requirements; owner merge is allowed only when the exact PR head has all required checks green, review threads are resolved, strict up-to-date status enforcement is enabled, bypass actors are absent, and force-push/deletion protection is effective. Any unavailable control remains an explicit blocker or time-bounded approved exception rather than an assumption.",
      "done": false
    },
    {
      "id": "AC-2",
      "text": "SAST coverage is capability-correct: CodeQL is used only for supported JavaScript/TypeScript/GitHub-Actions surfaces, while PHP receives a PHP-capable SAST/taint-analysis path with an explicit severity/failure policy",
      "done": true
    },
    {
      "id": "AC-3",
      "text": "Dependency, secret and applicable container/image scanning run in CI with deterministic severity handling, documented false-positive/exception ownership and no committed credentials",
      "done": true
    },
    {
      "id": "AC-4",
      "text": "Third-party GitHub Actions used by privileged workflows are pinned to immutable full commit SHAs or have a documented owner, rationale and expiry for an approved exception; workflow permissions remain least-privilege",
      "done": true
    },
    {
      "id": "AC-5",
      "text": "A reproducible SBOM and practical build/release provenance path are defined and exercised, with current OpenSSF/SLSA guidance treated as researched baselines rather than marketing claims",
      "done": true
    },
    {
      "id": "AC-6",
      "text": "Security-control changes include regression evidence and do not introduce provider SDKs, connector implementations, delivery routing or other TASK-0015+ product work",
      "done": true
    },
    {
      "id": "AC-7",
      "text": "AI continuity validation and all applicable application/security quality gates are green on the exact TASK-0014 acceptance head",
      "done": true
    }
