    "php artisan test",
    "php artisan test --testsuite=Integration",
    "composer analyse",
    "composer lint:check",
    "npm run typecheck",
    "npm run test",
    "npm run build",
    "npm run test:e2e"
  ],
  "exact_next_action": "Implement provider-neutral queue routing, durable logical-operation idempotency, concurrency-safe workspace/provider/channel rate and quota enforcement, and observable backpressure/fairness controls over immutable TASK-0020 execution snapshots; do not implement retry classification, circuit breakers, dead letters, reconciliation, failover, sender-domain/deliverability policy, or later PHASE-04 work in TASK-0021."
