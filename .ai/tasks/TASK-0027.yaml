    {"id":"AC-6","text":"Suppression and objection remain deterministic authority: AI recommendations, provider failover, deliverability or reputation scoring, campaign settings, admin convenience, bought/public-list provenance, or later optimization logic cannot override them; TASK-0028 frequency/reputation policy is not implemented early","done":true},
