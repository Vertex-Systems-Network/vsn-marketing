    "python tools/ai_journal.py validate",
    "python tools/ai_policy.py",
    "python tools/ai_parallel.py validate",
    "python tools/ai_context.py manifest",
    "composer test",
    "composer analyse",
    "npm test",
    "npm run build"
  ],
  "exact_next_action": "Freeze TASK-0028 deterministic frequency-cap, provider-versioned reputation/health, and safe-sending policy contracts on top of TASK-0027 suppression authority; implement fail-closed evaluation without anti-abuse evasion, provider-limit circumvention, consent creation, or suppression override, then certify with unit, PostgreSQL integration, adversarial security, continuity, application and supply-chain gates."
