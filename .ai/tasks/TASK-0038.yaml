{
  "schema_version": 1,
  "id": "TASK-0038",
  "phase": "PHASE-07",
  "module": "Publishing",
  "title": "Implement campaign lifecycle, immutable snapshots, recipients/targets, approvals, and audit history",
  "status": "ready",
  "objective": "Implement the provider-neutral, workspace-scoped canonical campaign domain for governed cross-channel work: deterministic campaign lifecycle, immutable campaign/publication snapshots, exact recipient/target bindings, snapshot-bound approvals and append-oriented audit history, while keeping provider publication attempts, production scheduling execution and credential activation outside this task.",
  "dependencies": [
    "TASK-0037"
  ],
  "acceptance_criteria": [
    {
      "id": "AC-1",
      "text": "Workspace-scoped campaign aggregates persist deterministic lifecycle state and guarded transitions for draft/review/needs-approval/approved/ready-or-scheduled-intent/cancelled/completed semantics; invalid, stale or unauthorized transitions fail closed and every accepted transition records actor, reason, prior state and resulting state without invoking provider publication or a production scheduler",
      "done": true
    },
    {
      "id": "AC-2",
      "text": "Every approval-eligible campaign revision resolves to an immutable snapshot that pins exact content/template/component/brand/media versions, canonical target/recipient identity, intended execution metadata and required capability-evidence references; material edits create a new snapshot instead of mutating an approved or execution-pinned snapshot",
      "done": true
    },
    {
      "id": "AC-3",
      "text": "Recipient and target bindings are canonical, workspace-isolated and provider-neutral: exact channel/account/recipient selections or materialized sets are reproducible from stable VSN identities, cannot cross workspace boundaries, and never treat temporary provider upload/container/post identifiers as canonical authority",
      "done": true
    },
    {
      "id": "AC-4",
      "text": "Approval decisions bind to the exact immutable campaign snapshot, authorized target set, approver identity/role and current required capability evidence; material content/target edits, revoked authorization, stale/incompatible capability evidence or approval expiry invalidate or re-evaluate approval deterministically rather than silently inheriting stale authority",
      "done": true
    },
    {
      "id": "AC-5",
      "text": "Campaign and approval history is append-oriented and auditable: lifecycle transitions, snapshot creation, approval/rejection/revocation, target changes and cancellation/completion decisions preserve immutable actor/time/reason/evidence provenance and can reconstruct the authoritative history without rewriting prior facts",
      "done": true
    },
    {
      "id": "AC-6",
      "text": "Campaign-domain mutations are transaction-safe, concurrency-safe and idempotent where replay is possible; duplicate commands, stale versions and partial failures cannot create conflicting canonical snapshots, duplicate approvals or cross-workspace references, and migration/data-safety requirements are explicitly covered where schema changes are introduced",
      "done": true
    },
    {
      "id": "AC-7",
      "text": "The implementation preserves prior consent, suppression, sender-safety, content/version, asset, provider-capability and workspace-security boundaries; provider credentials/secrets remain referenced outside canonical campaign records, capability/app-review/account-role evidence fails closed when missing or stale, and no live provider API call, media upload, publication attempt or production scheduling worker is activated by TASK-0038",
      "done": true
    },
    {
      "id": "AC-8",
      "text": "Backend, PostgreSQL integration and adversarial tests prove lifecycle guards, snapshot immutability, approval invalidation, target/recipient isolation, append-only auditability, transaction/idempotency behavior and provider-neutral authority; exact-head AI continuity, architecture/static-analysis/formatting, application, integration and security/supply-chain gates are green before TASK-0039 registration",
      "done": true
    }
  ],
  "required_tests": [
    "python tools/ai_txn.py validate",
    "python tools/ai_state.py validate",
    "python tools/ai_journal.py validate",
    "python tools/supervisor_contract.py validate",
    "python tools/runner_benchmark.py validate",
    "python tools/ai_policy.py",
    "python tools/ai_parallel.py validate",
    "python tools/ai_context.py manifest",
    "php artisan test",
    "php artisan test --testsuite=Integration",
    "composer analyse",
    "composer lint:check",
    "npm run typecheck",
    "npm run test",
    "npm run build",
    "npm run test:e2e"
  ],
  "exact_next_action": "TASK-0038 final acceptance is trusted on protected main. Verify and merge the separate TASK-0039 planned-registration milestone without activating scheduler implementation. After registration is terminally reconciled, perform a separate guarded transition that marks TASK-0038 completed and activates TASK-0039 ready. Keep live provider publication, provider-native scheduling side effects, media upload, provider credentials, deployment/release authority and the deferred Runner benchmark batch inactive."
}
