  "exact_next_action": "Verify PR #380 on its unchanged exact head. Merge TASK-0040 AC-5 partial-success aggregation only if AI Continuity Guard, Application Foundation CI and Security Supply Chain CI are terminal green, review is clean, unit/security/PostgreSQL tests prove deterministic snapshot-target aggregation, successful targets remain excluded from retry selection, retry eligibility requires canonical failed_retriable attempt state plus trusted failed provider projection, stale/duplicate provider evidence cannot rewrite aggregate evidence, and workspace boundaries fail closed. After trusted merge, the next Fast Batch must carry PR #380 evidence forward, mark AC-5 complete, and begin bounded AC-6 capability-gated retry/edit/delete authorization semantics without activating production provider side effects. Keep TASK-0041, deployment/release authority and deferred Runner optimization inactive."
