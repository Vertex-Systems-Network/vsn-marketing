version: 2

# Declare only ecosystems that exist on the default branch.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: &weekly
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Asia/Karachi"
    cooldown: &cooldown
      default-days: 7
    open-pull-requests-limit: 5
    commit-message: &commit_message
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "composer"
    directory: "/"
    schedule: *weekly
    cooldown: *cooldown
    open-pull-requests-limit: 5
    commit-message: *commit_message

  - package-ecosystem: "npm"
    directory: "/"
    schedule: *weekly
    cooldown: *cooldown
    open-pull-requests-limit: 5
    commit-message: *commit_message
