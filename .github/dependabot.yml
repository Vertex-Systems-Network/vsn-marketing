version: 2

# Keep this file aligned with dependencies that actually exist on the default branch.
# Add npm/composer/docker ecosystems only after their manifests are introduced by a
# governed stack/bootstrap task; declaring nonexistent ecosystems creates noisy,
# misleading Dependabot jobs.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"

    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Asia/Karachi"

    # Delay routine version updates briefly while leaving security updates unaffected.
    cooldown:
      default-days: 7

    open-pull-requests-limit: 5

    commit-message:
      prefix: "chore"
      include: "scope"
