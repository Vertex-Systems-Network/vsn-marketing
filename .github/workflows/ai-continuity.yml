name: AI Continuity Guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-continuity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Require immutable GitHub Actions dependencies
        run: python tools/check_action_pins.py
      - name: Validate transactional continuity state
        run: python tools/ai_txn.py validate
      - name: Validate repository AI state
        run: python tools/ai_state.py validate
      - name: Validate hash-chained execution journal
        run: python tools/ai_journal.py validate
      - name: Validate AI policy registries
        run: python tools/ai_policy.py
      - name: Test transactional continuity recovery
        run: python tools/test_ai_txn.py
      - name: Test AI continuity integrity guards
        run: python tools/test_ai_continuity.py
      - name: Test deterministic AI context packs
        run: python tools/test_ai_context.py
      - name: Test AI policy negative guards
        run: python tools/test_ai_policy.py
      - name: Compile deterministic AI context manifest
        run: python tools/ai_context.py manifest > /tmp/vsn-ai-context-manifest.json
      - name: Require append-only journal history (PR)
        if: github.event_name == 'pull_request'
        run: python tools/ai_journal.py verify-append-only --base "${{ github.event.pull_request.base.sha }}"
      - name: Require append-only journal history (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python tools/ai_journal.py verify-append-only --base "${{ github.event.before }}"
      - name: Show deterministic handoff
        run: |
          python tools/ai_state.py status
          python tools/ai_journal.py status
      - name: Require ledger update for product changes (PR)
        if: github.event_name == 'pull_request'
        run: python tools/ai_state.py verify-change-set --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
      - name: Require ledger update for product changes (push)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python tools/ai_state.py verify-change-set --base "${{ github.event.before }}" --head "${{ github.sha }}"

  publish-default-branch-governance:
    name: publish-default-branch-governance
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: governance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      issues: write
    env:
      GOVERNANCE_RESULT: ${{ needs.governance.result }}
    steps:
      - name: Publish default-branch governance status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const result = process.env.GOVERNANCE_RESULT;
            const state = result === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'governance-main',
              description: `AI Continuity Guard ${state}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Append default-branch governance ledger
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const outcome = process.env.GOVERNANCE_RESULT === 'success' ? 'PASS' : 'FAIL';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6,
              body: `AI_CONTINUITY_MAIN ${outcome}\ncommit: ${context.sha}\nrun_id: ${context.runId}\nrun: ${runUrl}`,
            });
