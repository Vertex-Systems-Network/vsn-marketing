name: Application Foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, ship/week-1]

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: application-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    outputs:
      application_required: ${{ steps.classify.outputs.application_required }}
      change_class: ${{ steps.classify.outputs.change_class }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python for CI policy
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Classify exact change set
        id: classify
        run: >-
          python tools/ci_change_policy.py classify
          --base "${BASE_SHA}"
          --head "${TARGET_SHA}"
          --event-path "${GITHUB_EVENT_PATH}"
          --github-output "${GITHUB_OUTPUT}"
      - name: Set up PHP 8.5
        if: steps.classify.outputs.application_required == 'true'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, pdo_pgsql, redis, pcntl, posix
          coverage: none
      - name: Set up Node 24
        if: steps.classify.outputs.application_required == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Validate locked Composer manifest
        if: steps.classify.outputs.application_required == 'true'
        run: composer validate --strict
      - name: Install locked PHP dependencies
        if: steps.classify.outputs.application_required == 'true'
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install locked frontend dependencies
        if: steps.classify.outputs.application_required == 'true'
        run: npm ci --no-audit --no-fund
      - name: Prepare application environment
        if: steps.classify.outputs.application_required == 'true'
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Validate Docker Compose contract
        if: steps.classify.outputs.application_required == 'true'
        run: docker compose config --quiet
      - name: Build developer PHP image
        if: steps.classify.outputs.application_required == 'true'
        run: docker build --tag vsn-marketing-foundation:test --file docker/app/Dockerfile .
      - name: Run backend tests
        if: steps.classify.outputs.application_required == 'true'
        run: php artisan test --fail-on-warning --display-warnings
      - name: Run architecture tests
        if: steps.classify.outputs.application_required == 'true'
        run: php artisan test tests/Architecture --fail-on-warning --display-warnings
      - name: Run PHP static analysis
        if: steps.classify.outputs.application_required == 'true'
        run: composer analyse
      - name: Check PHP formatting
        if: steps.classify.outputs.application_required == 'true'
        run: composer lint:check
      - name: Typecheck frontend
        if: steps.classify.outputs.application_required == 'true'
        run: npm run typecheck
      - name: Run frontend unit tests
        if: steps.classify.outputs.application_required == 'true'
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: npm run test
      - name: Build frontend
        if: steps.classify.outputs.application_required == 'true'
        run: npm run build

  php-floor:
    needs: foundation
    if: ${{ needs.foundation.outputs.application_required == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up PHP 8.3 compatibility floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, pdo_pgsql, redis, pcntl, posix
          coverage: none
      - name: Validate locked Composer manifest
        run: composer validate --strict
      - name: Install locked PHP dependencies at compatibility floor
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Run backend tests on PHP 8.3
        run: php artisan test --fail-on-warning --display-warnings

  integration:
    needs: foundation
    if: ${{ needs.foundation.outputs.application_required == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vsn_marketing_test
          POSTGRES_USER: vsn
          POSTGRES_PASSWORD: vsn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsn -d vsn_marketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vsn_marketing_test
      DB_USERNAME: vsn
      DB_PASSWORD: vsn
      DB_SSLMODE: disable
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
      REDIS_QUEUE_DB: 2
      REDIS_LOCK_DB: 3
      REDIS_QUEUE_CONNECTION: queue
      QUEUE_CONNECTION: redis
      QUEUE_FAILED_DRIVER: database-uuids
      FILESYSTEM_DISK: local
      OBJECT_STORE_DISK: local
      SESSION_DRIVER: array
      RUN_INFRA_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, pdo_pgsql, redis, pcntl, posix
          coverage: none
      - name: Validate locked Composer manifest
        run: composer validate --strict
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare integration environment
        run: touch .env
      - name: Run infrastructure integration suite
        run: php artisan test --testsuite=Integration --fail-on-warning --display-warnings

  e2e:
    needs: foundation
    if: ${{ needs.foundation.outputs.application_required == 'true' }}
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: file
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      QUEUE_FAILED_DRIVER: null
      FILESYSTEM_DISK: local
      OBJECT_STORE_DISK: local
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical Playwright smoke
        run: npm run test:e2e
