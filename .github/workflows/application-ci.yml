name: Application Foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: application-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, pdo_pgsql, redis, pcntl, posix
          coverage: none
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate locked Composer manifest
        run: composer validate --strict
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Validate Docker Compose contract
        run: docker compose config --quiet
      - name: Build developer PHP image
        run: docker build --tag vsn-marketing-foundation:test --file docker/app/Dockerfile .
      - name: Run backend tests
        run: php artisan test --fail-on-warning --display-warnings
      - name: Run architecture tests
        run: php artisan test tests/Architecture --fail-on-warning --display-warnings
      - name: Run PHP static analysis
        run: composer analyse
      - name: Check PHP formatting
        run: composer lint:check
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Run frontend unit tests
        env:
          LARAVEL_BYPASS_ENV_CHECK: '1'
        run: npm run test
      - name: Build frontend
        run: npm run build

  php-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up PHP 8.3 compatibility floor
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, pdo_pgsql, redis, pcntl, posix
          coverage: none
      - name: Validate locked Composer manifest
        run: composer validate --strict
      - name: Install locked PHP dependencies at compatibility floor
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Run backend tests on PHP 8.3
        run: php artisan test --fail-on-warning --display-warnings

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: vsn_marketing_test
          POSTGRES_USER: vsn
          POSTGRES_PASSWORD: vsn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsn -d vsn_marketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vsn_marketing_test
      DB_USERNAME: vsn
      DB_PASSWORD: vsn
      DB_SSLMODE: disable
      CACHE_STORE: redis
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_CACHE_DB: 1
      REDIS_QUEUE_DB: 2
      REDIS_LOCK_DB: 3
      REDIS_QUEUE_CONNECTION: queue
      QUEUE_CONNECTION: redis
      QUEUE_FAILED_DRIVER: database-uuids
      FILESYSTEM_DISK: local
      OBJECT_STORE_DISK: local
      SESSION_DRIVER: array
      RUN_INFRA_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, pdo_pgsql, redis, pcntl, posix
          coverage: none
      - name: Validate locked Composer manifest
        run: composer validate --strict
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare integration environment
        run: touch .env
      - name: Run infrastructure integration suite
        run: php artisan test --testsuite=Integration --fail-on-warning --display-warnings

  e2e:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      APP_URL: http://127.0.0.1:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: file
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      QUEUE_FAILED_DRIVER: null
      FILESYSTEM_DISK: local
      OBJECT_STORE_DISK: local
      LOG_CHANNEL: stderr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install locked frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Build frontend
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run critical Playwright smoke
        run: npm run test:e2e
