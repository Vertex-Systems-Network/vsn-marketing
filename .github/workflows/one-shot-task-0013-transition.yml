name: One-shot TASK-0013 transactional activation

on:
  push:
    branches:
      - state/activate-task-0013

permissions:
  contents: write

jobs:
  activate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical activation branch
        uses: actions/checkout@v7
        with:
          ref: state/activate-task-0013
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Recover and validate continuity before transition
        run: |
          python tools/ai_txn.py recover
          python tools/ai_txn.py validate
          python tools/ai_policy.py

      - name: Activate TASK-0013 through canonical transaction engine
        run: |
          python tools/ai_txn.py transition \
            --complete TASK-0012 \
            --next TASK-0013 \
            --evidence "Research-first planning PR #23 merged and passed exact-head AI Continuity Guard 32788583874 plus Application Foundation CI 32788583810; semantic continuation fix PR #24 passed exact-head AI Continuity Guard 32789715725 plus Application Foundation CI 32789715701 and merged to corrected main 78eb6e320e896bcadfd8bc68c7578605f0bbc150; corrected main AI Continuity Guard 32789933608 passed." \
            --tests "PR #23 exact head: AI Continuity Guard 32788583874 PASS and Application Foundation CI 32788583810 PASS; merge head ae1df74f: AI Continuity Guard 32789253700 PASS and Application Foundation CI 32789253811 PASS; PR #24 exact head: AI Continuity Guard 32789715725 PASS and Application Foundation CI 32789715701 PASS; corrected main 78eb6e32 AI Continuity Guard 32789933608 PASS."

      - name: Validate transition output
        run: |
          python tools/ai_txn.py validate
          python tools/ai_policy.py
          python tools/ai_state.py status
          python tools/ai_journal.py status
          python tools/ai_context.py manifest > /tmp/ai-context-manifest.json

      - name: Remove one-shot runner and guard changed paths
        run: |
          git rm .github/workflows/one-shot-task-0013-transition.yml
          python - <<'PY'
          import subprocess
          import sys

          allowed = {
              '.github/workflows/one-shot-task-0013-transition.yml',
              '.ai/tasks/TASK-0012.yaml',
              '.ai/tasks/TASK-0013.yaml',
              '.ai/tasks/INDEX.yaml',
              '.ai/roadmap/ROADMAP.yaml',
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
          }
          proc = subprocess.run(['git', 'status', '--porcelain=v1'], text=True, stdout=subprocess.PIPE, check=True)
          changed = set()
          for raw in proc.stdout.splitlines():
              if not raw:
                  continue
              path = raw[3:].strip()
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)
          unexpected = sorted(changed - allowed)
          required = {
              '.ai/tasks/TASK-0013.yaml',
              '.ai/tasks/INDEX.yaml',
              '.ai/roadmap/ROADMAP.yaml',
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
              '.github/workflows/one-shot-task-0013-transition.yml',
          }
          missing = sorted(required - changed)
          if unexpected or missing:
              if unexpected:
                  print('Unexpected changed paths:', *unexpected, sep='\n- ', file=sys.stderr)
              if missing:
                  print('Expected transition paths missing:', *missing, sep='\n- ', file=sys.stderr)
              raise SystemExit(1)
          print('Changed-path guard passed.')
          PY

      - name: Commit canonical transition output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: activate TASK-0013 transactionally" \
            -m "Generated by tools/ai_txn.py from corrected canonical main after exact-head continuity and application gates passed. The one-shot runner removes itself in this commit."
          git push origin HEAD:state/activate-task-0013
