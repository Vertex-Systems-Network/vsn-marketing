name: One-shot TASK-0014 transactional activation

on:
  push:
    branches:
      - state/complete-task-0013-activate-0014

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical transition branch
        uses: actions/checkout@v7
        with:
          ref: state/complete-task-0013-activate-0014
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Recover and validate continuity before transition
        run: |
          python tools/ai_txn.py recover
          python tools/ai_txn.py validate

      - name: Complete TASK-0013 and activate TASK-0014 transactionally
        run: >-
          python tools/ai_txn.py transition
          --complete TASK-0013
          --next TASK-0014
          --evidence "TASK-0013 PR #26 acceptance head 50ca037224acf6b1830c6595ac3161f05d7332ab: AI Continuity 32792717143 PASS and Application Foundation CI 32792717124 PASS; merged main head 6339bcf2bab50a35b38ebb3e09430fbcdb7ee339: AI Continuity 32792881847 PASS and Application Foundation CI 32792881826 PASS."
          --tests "python tools/ai_txn.py validate; python tools/ai_state.py validate; python tools/ai_journal.py validate; python tools/ai_policy.py; python tools/ai_context.py manifest; php artisan test; php artisan test --testsuite=Integration; composer analyse; composer lint:check; npm run typecheck; npm run test; npm run build; npm run test:e2e"

      - name: Validate generated transition state
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/ai_policy.py
          python tools/ai_context.py manifest > /tmp/task-0014-context.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          state = json.loads((root / '.ai/state/CURRENT-STATE.yaml').read_text())
          task13 = json.loads((root / '.ai/tasks/TASK-0013.yaml').read_text())
          task14 = json.loads((root / '.ai/tasks/TASK-0014.yaml').read_text())
          index = json.loads((root / '.ai/tasks/INDEX.yaml').read_text())
          by_id = {item['id']: item for item in index['tasks']}

          assert state['execution']['status'] == 'ready', state
          assert state['execution']['current_phase'] == 'PHASE-03', state
          assert state['execution']['active_task'] == 'TASK-0014', state
          assert state['execution']['last_completed_task'] == 'TASK-0013', state
          assert state['execution']['next_task'] == 'TASK-0015', state
          assert state['blockers'] == [], state
          assert task13['status'] == 'completed', task13
          assert task14['status'] == 'ready', task14
          assert by_id['TASK-0013']['status'] == 'completed', by_id['TASK-0013']
          assert by_id['TASK-0014']['status'] == 'ready', by_id['TASK-0014']
          assert by_id['TASK-0015']['status'] == 'planned', by_id['TASK-0015']
          assert abs(float(state['progress']['phase_percent']) - 15.0) < 0.0001, state['progress']
          assert abs(float(state['progress']['roadmap_percent']) - 19.05) < 0.0001, state['progress']
          print('TASK-0014 transactional state semantics: PASS')
          PY

      - name: Remove one-shot workflow and guard changed paths
        run: |
          rm .github/workflows/one-shot-task-0014-transition.yml
          python - <<'PY'
          import subprocess

          workflow = '.github/workflows/one-shot-task-0014-transition.yml'
          allowed = {
              workflow,
              '.ai/tasks/TASK-0013.yaml',
              '.ai/tasks/TASK-0014.yaml',
              '.ai/tasks/INDEX.yaml',
              '.ai/roadmap/ROADMAP.yaml',
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
          }
          required = {
              '.ai/tasks/TASK-0013.yaml',
              '.ai/tasks/TASK-0014.yaml',
              '.ai/tasks/INDEX.yaml',
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
          }
          out = subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              changed.add(path)
          unexpected = changed - allowed
          missing = required - changed
          if unexpected or missing:
              raise SystemExit(f'changed-path guard failed: unexpected={sorted(unexpected)} missing={sorted(missing)} changed={sorted(changed)}')
          print('Transition changed-path guard: PASS', sorted(changed))
          PY

      - name: Commit canonical transition output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: complete TASK-0013 and activate TASK-0014 transactionally" -m "Generated by tools/ai_txn.py only after TASK-0013 acceptance and merge-head gates passed. The one-shot runner removes itself in this commit."
          git push origin HEAD:state/complete-task-0013-activate-0014
