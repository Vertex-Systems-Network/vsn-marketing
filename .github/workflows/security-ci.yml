name: Security Supply Chain CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: security-supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  action-integrity:
    name: action-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Enforce immutable workflow dependencies
        run: python tools/check_action_pins.py
      - name: Validate security exception governance
        run: python tools/security_exceptions.py
      - name: Test security controls
        run: python tools/test_security_controls.py
      - name: Test main ruleset AC-1 operator
        run: python tools/apply_main_ruleset.py --self-test

  codeql:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - name: Analyze supported CodeQL surface
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}

  php-sast:
    name: php-sast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Install reviewed PHP-capable SAST engine
        run: python -m pip install --disable-pip-version-check 'semgrep==1.173.0'
      - name: Run PHP/Laravel taint rules without inline suppression
        run: >-
          semgrep scan
          --config .semgrep.yml
          --metrics=off
          --disable-nosem
          --error
          --severity ERROR
          app routes

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Audit locked Composer dependencies
        run: composer audit --locked --no-interaction --abandoned=report
      - name: Audit locked npm dependencies at high-or-critical severity
        run: npm audit --audit-level=high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Trivy
        run: bash tools/install_trivy.sh "$RUNNER_TEMP/vsn-trivy"
      - name: Scan repository tree for credentials at every secret severity
        run: >-
          "$RUNNER_TEMP/vsn-trivy/trivy" fs
          --scanners secret
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          --exit-code 1
          --skip-dirs .git
          --skip-dirs vendor
          --skip-dirs node_modules
          .

  container-scan:
    name: container-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Build application container for scanning
        run: docker build --tag "vsn-marketing-security:${TARGET_SHA}" --file docker/app/Dockerfile .
      - name: Install checksum-verified Trivy
        run: bash tools/install_trivy.sh "$RUNNER_TEMP/vsn-trivy"
      - name: Fail on fixed critical container vulnerabilities
        run: >-
          "$RUNNER_TEMP/vsn-trivy/trivy" image
          --scanners vuln
          --severity CRITICAL
          --ignore-unfixed
          --exit-code 1
          "vsn-marketing-security:${TARGET_SHA}"
      - name: Fail on embedded container secrets at every severity
        run: >-
          "$RUNNER_TEMP/vsn-trivy/trivy" image
          --scanners secret
          --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          --exit-code 1
          "vsn-marketing-security:${TARGET_SHA}"

  sbom-reproducibility:
    name: sbom-reproducibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Trivy
        run: bash tools/install_trivy.sh "$RUNNER_TEMP/vsn-trivy"
      - name: Generate supply-chain artifacts twice
        env:
          TRIVY_BIN: ${{ runner.temp }}/vsn-trivy/trivy
        run: |
          bash tools/build_supply_chain_artifacts.sh "$RUNNER_TEMP/supply-chain-a"
          bash tools/build_supply_chain_artifacts.sh "$RUNNER_TEMP/supply-chain-b"
      - name: Prove source archive and normalized SBOM are reproducible
        run: |
          cmp "$RUNNER_TEMP/supply-chain-a/vsn-marketing-source.tar.gz" "$RUNNER_TEMP/supply-chain-b/vsn-marketing-source.tar.gz"
          cmp "$RUNNER_TEMP/supply-chain-a/vsn-marketing-sbom.cdx.json" "$RUNNER_TEMP/supply-chain-b/vsn-marketing-sbom.cdx.json"
          (cd "$RUNNER_TEMP/supply-chain-a" && sha256sum --check SHA256SUMS)

  security-gates:
    name: security-gates
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs:
      - action-integrity
      - codeql
      - php-sast
      - dependency-audit
      - secret-scan
      - container-scan
      - sbom-reproducibility
    env:
      ACTION_INTEGRITY: ${{ needs.action-integrity.result }}
      CODEQL: ${{ needs.codeql.result }}
      PHP_SAST: ${{ needs.php-sast.result }}
      DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
      SECRET_SCAN: ${{ needs.secret-scan.result }}
      CONTAINER_SCAN: ${{ needs.container-scan.result }}
      SBOM_REPRODUCIBILITY: ${{ needs.sbom-reproducibility.result }}
    steps:
      - name: Require every security gate
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for gate in \
            "action-integrity=${ACTION_INTEGRITY}" \
            "codeql=${CODEQL}" \
            "php-sast=${PHP_SAST}" \
            "dependency-audit=${DEPENDENCY_AUDIT}" \
            "secret-scan=${SECRET_SCAN}" \
            "container-scan=${CONTAINER_SCAN}" \
            "sbom-reproducibility=${SBOM_REPRODUCIBILITY}"; do
            printf '%s\n' "$gate"
            [[ "${gate#*=}" == "success" ]] || failed=1
          done
          exit "$failed"
