name: TASK-0005 Bootstrap

on:
  push:
    branches:
      - feat/task-0005-identity-tenancy-rbac

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/task-0005-identity-tenancy-rbac
          fetch-depth: 0

      - name: Materialize scoped TASK-0005 change set
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, tarfile
          payload = ''''''
          data = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              archive.extractall('.')
          PY

      - name: Commit TASK-0005 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai app bootstrap config database routes tests
          git commit -m "feat: start TASK-0005 identity tenancy RBAC"
          git push origin HEAD:feat/task-0005-identity-tenancy-rbac
