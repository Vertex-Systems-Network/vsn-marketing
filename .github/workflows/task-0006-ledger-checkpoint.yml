name: TASK-0006 ledger checkpoint

on:
  push:
    branches: [task-0006-canonical-events]

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v7
        with:
          ref: task-0006-canonical-events
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Recover and validate continuity
        run: |
          python tools/ai_txn.py recover
          python tools/ai_txn.py validate
      - name: Record implementation checkpoint transactionally
        run: >-
          python tools/ai_txn.py checkpoint
          --summary "Implemented TASK-0006 candidate on branch task-0006-canonical-events: versioned canonical event envelope and typed outbox listener; AuditEvent persistence; database-backed duplicate-safe idempotency; bounded outbox retry with terminal dead-letter state and explicit replay; unit/integration acceptance coverage and canonical event versioning documentation."
          --tests "Pre-implementation exact main HEAD governance-main PASS run 32638878905. TASK-0006 candidate tests are committed but GitHub-hosted application/integration certification is pending."
          --next "Run GitHub-hosted Application Foundation CI and AI Continuity Guard for the TASK-0006 candidate; fix any failures without changing acceptance criteria, then complete TASK-0006 only after all five criteria have exact-head evidence."
      - name: Remove one-shot workflow and commit transactional ledger
        shell: bash
        run: |
          rm .github/workflows/task-0006-ledger-checkpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: checkpoint TASK-0006 implementation"
          git push origin HEAD:task-0006-canonical-events
