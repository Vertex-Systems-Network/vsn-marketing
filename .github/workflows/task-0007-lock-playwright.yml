name: TASK-0007 Lock Playwright

on:
  push:
    branches: [task-0007-ci-observability]

permissions:
  contents: write

jobs:
  lock-playwright:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: task-0007-ci-observability
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Lock Playwright test dependency
        run: npm install --save-dev --save-exact @playwright/test@1.62.1 --no-audit --no-fund
      - name: Remove one-shot workflow and commit dependency lock
        run: |
          rm .github/workflows/task-0007-lock-playwright.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/task-0007-lock-playwright.yml
          git commit -m "build: lock Playwright for TASK-0007"
          git push origin HEAD:task-0007-ci-observability
