name: TASK-0007 Start Checkpoint

on:
  push:
    branches: [task-0007-ci-observability]

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact task branch
        uses: actions/checkout@v7
        with:
          ref: task-0007-ci-observability
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Recover and validate continuity
        run: |
          python tools/ai_txn.py recover
          python tools/ai_txn.py validate
      - name: Record TASK-0007 start checkpoint transactionally
        run: >-
          python tools/ai_txn.py checkpoint
          --summary "Started TASK-0007 implementation from certified main 05abe3aee388e4e30c92a6a10229c632202942d3: full backend/frontend/e2e CI and baseline observability are now in progress; no future task work is included."
          --tests "Preflight PASS: canonical state and TASK-0007 acceptance criteria inspected; main HEAD 05abe3aee388e4e30c92a6a10229c632202942d3; no open PRs; no blockers."
          --next "Implement the TASK-0007 CI matrix, structured correlation-aware observability, health/metrics surfaces, and acceptance tests; then certify all required suites on the exact PR head."
      - name: Validate checkpoint and remove one-shot workflow
        run: |
          python tools/ai_txn.py validate
          rm .github/workflows/task-0007-start-checkpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: checkpoint TASK-0007 start"
          git push origin HEAD:task-0007-ci-observability
