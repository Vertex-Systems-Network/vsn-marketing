name: TASK-0008 Activation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  activate:
    if: github.head_ref == 'activate-task-0008' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout activation branch
        uses: actions/checkout@v7
        with:
          ref: activate-task-0008
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Validate reconciled PHASE-02 plan
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/test_ai_txn.py
          python tools/test_ai_continuity.py

      - name: Activate TASK-0008 transactionally
        run: |
          python tools/ai_txn.py transition \
            --complete TASK-0007 \
            --next TASK-0008 \
            --evidence "PHASE-02 task chain TASK-0008 through TASK-0012 is merged on main at ed5fc609ecfb1ee2e92ef41c918eb1d8e693aeca; governance-main run 32660988654 is green. Planning PR #16 exact head 6124bc8bf15af52a5cec93fd4e27ad367d750af0 passed AI Continuity Guard 32660764046 and Application Foundation CI 32660764038." \
            --tests "AI Continuity Guard 32660764046 PASS; Application Foundation CI 32660764038 PASS including PHP 8.3, PostgreSQL 18 + Redis 8 integration, Playwright, backend, architecture, Larastan, Pint, TypeScript, Vitest, and production build; governance-main 32660988654 PASS on merged plan."

      - name: Refresh task test handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path('.ai/state/TEST-STATE.yaml')
          data = json.loads(path.read_text(encoding='utf-8'))
          data['updated_for_task'] = 'TASK-0008'
          data['application_tests'] = {
              'status': 'passing',
              'reason': 'PHASE-02 planning baseline passed Application Foundation CI run 32660764038 on exact plan head 6124bc8bf15af52a5cec93fd4e27ad367d750af0; TASK-0008 has not changed product code yet.'
          }
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Validate activated state
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/ai_policy.py
          python tools/test_ai_txn.py
          python tools/test_ai_continuity.py
          python tools/test_ai_context.py
          python tools/test_ai_policy.py
          python tools/ai_context.py manifest > /tmp/vsn-ai-context-manifest.json

      - name: Commit canonical activation
        run: |
          rm .github/workflows/task-0008-activation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ai/tasks/TASK-0007.yaml .ai/tasks/TASK-0008.yaml .ai/tasks/INDEX.yaml .ai/roadmap/ROADMAP.yaml .ai/state/CURRENT-STATE.yaml .ai/state/TEST-STATE.yaml .ai/state/LAST-CHECKPOINT.md .ai/state/EXECUTION-JOURNAL.jsonl .github/workflows/task-0008-activation.yml
          git commit -m "chore: activate TASK-0008 customer data foundation"
          git push origin HEAD:activate-task-0008
