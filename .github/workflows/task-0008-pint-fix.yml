name: TASK-0008 Pint Fix

on:
  push:
    branches:
      - task-0008-contact-data-foundation

permissions:
  contents: write

jobs:
  pint-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: task-0008-contact-data-foundation
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply pinned Pint formatter
        run: vendor/bin/pint --parallel

      - name: Verify Pint is clean on second pass
        run: composer lint:check

      - name: Run warning-strict backend suite
        run: php artisan test --fail-on-warning --display-warnings

      - name: Show formatter-only diff
        run: git diff -- tests/Feature/Contacts/ContactDataFoundationTest.php tests/Unit/Contacts/ContactIdentityNormalizerTest.php

      - name: Commit formatter result and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/Feature/Contacts/ContactDataFoundationTest.php tests/Unit/Contacts/ContactIdentityNormalizerTest.php
          git rm .github/workflows/task-0008-pint-fix.yml
          git diff --cached --check
          git commit -m "style: apply pinned Pint fixes for TASK-0008"
          git push origin HEAD:task-0008-contact-data-foundation
