name: TASK-0008 Pint Fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'task-0008-contact-data-foundation'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply exact project Pint output
        run: vendor/bin/pint --parallel
      - name: Verify Pint is clean
        run: vendor/bin/pint --parallel --test
      - name: Show formatted files
        run: git status --short
      - name: Commit exact Pint output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Pint produced no changes"
            exit 0
          fi
          git commit -m "style: apply exact TASK-0008 Pint output"
          git push origin HEAD:task-0008-contact-data-foundation
