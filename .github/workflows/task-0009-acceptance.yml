name: TASK-0009 Acceptance Transition

on:
  push:
    branches:
      - task-0009-lists-tags-membership

permissions:
  contents: write

jobs:
  accept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: task-0009-lists-tags-membership
          fetch-depth: 0

      - name: Require certified parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4f6a65c2475df1d201518b7e0c4028e82509951e"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/task-0009-acceptance.yml"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate clean canonical state before acceptance
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate

      - name: Record exact TASK-0009 acceptance evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          task_path = Path('.ai/tasks/TASK-0009.yaml')
          task = json.loads(task_path.read_text(encoding='utf-8'))
          expected = {
              'AC-1': 'Canonical List and Tag models and persistence exist within the customer data core',
              'AC-2': 'List, tag, contact, and membership relationships are workspace-scoped and reject cross-workspace references',
              'AC-3': 'Add/remove membership and tag-assignment operations are deterministic and retry-safe',
              'AC-4': 'Membership state changes are auditable and do not implement PHASE-08 segment evaluation',
              'AC-5': 'Integration tests cover list/tag lifecycle, duplicate-safe membership changes, and tenant isolation',
          }
          assert task['id'] == 'TASK-0009'
          assert task['status'] == 'in_progress'
          assert {item['id']: item['text'] for item in task['acceptance_criteria']} == expected
          for item in task['acceptance_criteria']:
              item['done'] = True
          task_path.write_text(json.dumps(task, indent=2) + '\n', encoding='utf-8')

          test_state = {
              'schema_version': 1,
              'updated_for_task': 'TASK-0010',
              'suites': [
                  {
                      'name': 'ai-continuity-validation',
                      'command': 'python tools/ai_state.py validate',
                      'status': 'passing',
                      'notes': 'AI Continuity Guard run 32667911144 passed exact TASK-0009 product head 4f6a65c2475df1d201518b7e0c4028e82509951e, including transactional state, journal integrity, policy registries, context, append-only history, and product-change ledger guard.'
                  },
                  {
                      'name': 'backend-tests',
                      'command': 'php artisan test',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32667911159 passed backend tests on exact TASK-0009 head 4f6a65c2475df1d201518b7e0c4028e82509951e, including the PHP 8.3 compatibility-floor job and retry-safe list/tag feature coverage.'
                  },
                  {
                      'name': 'postgresql-integration',
                      'command': 'php artisan test --testsuite=Integration',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32667911159 integration job passed on PostgreSQL 18 and Redis 8, including list/tag lifecycle, duplicate-safe membership/tag operations, audit evidence, and composite-FK cross-workspace rejection coverage.'
                  },
                  {
                      'name': 'php-static-analysis',
                      'command': 'composer analyse',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32667911159 foundation job passed Larastan on exact TASK-0009 head 4f6a65c2475df1d201518b7e0c4028e82509951e.'
                  },
                  {
                      'name': 'php-formatting',
                      'command': 'composer lint:check',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32667911159 foundation job passed pinned Pint formatting on exact TASK-0009 head 4f6a65c2475df1d201518b7e0c4028e82509951e.'
                  },
                  {
                      'name': 'critical-e2e',
                      'command': 'npm run test:e2e',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32667911159 e2e job passed the critical Playwright smoke on exact TASK-0009 head 4f6a65c2475df1d201518b7e0c4028e82509951e.'
                  }
              ],
              'application_tests': {
                  'status': 'passing',
                  'reason': 'TASK-0009 exact product head 4f6a65c2475df1d201518b7e0c4028e82509951e passed Application Foundation CI run 32667911159: php-floor, PostgreSQL/Redis integration, Playwright e2e, backend, architecture, Larastan, Pint, TypeScript typecheck, Vitest, and production build all succeeded.'
              }
          }
          Path('.ai/state/TEST-STATE.yaml').write_text(json.dumps(test_state, indent=2) + '\n', encoding='utf-8')

          state_path = Path('.ai/state/CURRENT-STATE.yaml')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          assert state['execution']['active_task'] == 'TASK-0009'
          assert state['execution']['status'] == 'in_progress'
          state['quality']['continuity_validation'] = 'task_0009_pr_head_passed'
          state['quality']['application_test_status'] = 'task_0009_ci_passed'
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

      - name: Validate acceptance inputs
        run: python tools/ai_state.py validate

      - name: Transition TASK-0009 to registered TASK-0010
        run: >-
          python tools/ai_txn.py transition
          --complete TASK-0009
          --next TASK-0010
          --evidence "Exact product head 4f6a65c2475df1d201518b7e0c4028e82509951e passed AI Continuity Guard run 32667911144 and Application Foundation CI run 32667911159. AC-1 through AC-5 are supported by canonical ContactList and Tag persistence, composite workspace isolation across lists/tags/contacts, retry-safe add/remove membership and assign/unassign tag operations, audit events emitted only for real state changes, and PostgreSQL lifecycle/security coverage. No PHASE-08 segment evaluation or TASK-0010 consent implementation is included."
          --tests "python tools/ai_state.py validate; php artisan test; php artisan test --testsuite=Integration; composer analyse; composer lint:check; hosted AI Continuity Guard 32667911144 PASS; hosted Application Foundation CI 32667911159 PASS (php-floor, integration, e2e, foundation)."

      - name: Validate final canonical transition
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate

      - name: Require exact successor and no future implementation
        shell: python
        run: |
          import json
          from pathlib import Path
          state = json.loads(Path('.ai/state/CURRENT-STATE.yaml').read_text(encoding='utf-8'))
          completed = json.loads(Path('.ai/tasks/TASK-0009.yaml').read_text(encoding='utf-8'))
          successor = json.loads(Path('.ai/tasks/TASK-0010.yaml').read_text(encoding='utf-8'))
          assert completed['status'] == 'completed'
          assert all(item['done'] is True for item in completed['acceptance_criteria'])
          assert state['execution']['active_task'] == 'TASK-0010'
          assert state['execution']['status'] == 'ready'
          assert state['execution']['last_completed_task'] == 'TASK-0009'
          assert successor['status'] == 'ready'
          assert all(item['done'] is False for item in successor['acceptance_criteria'])

      - name: Commit accepted canonical state and remove driver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-0009-acceptance.yml
          git add .ai/tasks/TASK-0009.yaml .ai/tasks/TASK-0010.yaml .ai/tasks/INDEX.yaml .ai/roadmap/ROADMAP.yaml .ai/state/CURRENT-STATE.yaml .ai/state/TEST-STATE.yaml .ai/state/LAST-CHECKPOINT.md .ai/state/EXECUTION-JOURNAL.jsonl
          git diff --cached --check
          git commit -m "chore: accept TASK-0009 lists tags membership"
          git push origin HEAD:task-0009-lists-tags-membership
