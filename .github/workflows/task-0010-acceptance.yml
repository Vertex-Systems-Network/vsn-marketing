name: TASK-0010 Acceptance Transition

on:
  push:
    branches:
      - task-0010-consent-evidence

permissions:
  contents: write

jobs:
  accept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: task-0010-consent-evidence
          fetch-depth: 0

      - name: Require certified parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "60a0b5cb7ea279898dfd861bf11ec3d43324501c"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/task-0010-acceptance.yml"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate clean canonical state before acceptance
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate

      - name: Record exact TASK-0010 acceptance evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          task_path = Path('.ai/tasks/TASK-0010.yaml')
          task = json.loads(task_path.read_text(encoding='utf-8'))
          expected = {
              'AC-1': 'ConsentRecord persistence captures immutable evidence with contact, workspace, channel/purpose, source, decision, and occurrence metadata',
              'AC-2': 'Consent history is append-oriented; prior evidence cannot be silently overwritten or deleted by normal application flows',
              'AC-3': 'Effective-consent queries are deterministic, workspace-scoped, and fail closed when evidence is absent or ambiguous',
              'AC-4': 'Consent-changing actions are audited and no AI/application path can bypass the canonical consent contract',
              'AC-5': 'Integration/security tests prove evidence preservation, deterministic eligibility, and cross-workspace denial without implementing suppression policy',
          }
          assert task['id'] == 'TASK-0010'
          assert task['status'] == 'in_progress'
          assert {item['id']: item['text'] for item in task['acceptance_criteria']} == expected
          for item in task['acceptance_criteria']:
              item['done'] = True
          task_path.write_text(json.dumps(task, indent=2) + '\n', encoding='utf-8')

          test_state = {
              'schema_version': 1,
              'updated_for_task': 'TASK-0011',
              'suites': [
                  {
                      'name': 'ai-continuity-validation',
                      'command': 'python tools/ai_state.py validate',
                      'status': 'passing',
                      'notes': 'AI Continuity Guard run 32669521904 passed exact TASK-0010 product head 60a0b5cb7ea279898dfd861bf11ec3d43324501c, including transactional state, journal integrity, policy registries, context, append-only history, and product-change ledger guard.'
                  },
                  {
                      'name': 'backend-tests',
                      'command': 'php artisan test',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32669521928 passed backend tests on exact TASK-0010 head 60a0b5cb7ea279898dfd861bf11ec3d43324501c, including PHP 8.3 and consent unit/feature coverage.'
                  },
                  {
                      'name': 'postgresql-integration',
                      'command': 'php artisan test --testsuite=Integration',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32669521928 integration job passed on PostgreSQL 18 and Redis 8, including append-only trigger rejection, evidence preservation, missing/ambiguous fail-closed eligibility, audit evidence, and cross-workspace composite-FK denial.'
                  },
                  {
                      'name': 'php-static-analysis',
                      'command': 'composer analyse',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32669521928 foundation job passed Larastan on exact TASK-0010 head 60a0b5cb7ea279898dfd861bf11ec3d43324501c.'
                  },
                  {
                      'name': 'php-formatting',
                      'command': 'composer lint:check',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32669521928 foundation job passed pinned Pint formatting on exact TASK-0010 head 60a0b5cb7ea279898dfd861bf11ec3d43324501c.'
                  },
                  {
                      'name': 'critical-e2e',
                      'command': 'npm run test:e2e',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32669521928 e2e job passed the critical Playwright smoke on exact TASK-0010 head 60a0b5cb7ea279898dfd861bf11ec3d43324501c.'
                  }
              ],
              'application_tests': {
                  'status': 'passing',
                  'reason': 'TASK-0010 exact product head 60a0b5cb7ea279898dfd861bf11ec3d43324501c passed Application Foundation CI run 32669521928: php-floor, PostgreSQL/Redis integration, Playwright e2e, backend, architecture, Larastan, Pint, TypeScript typecheck, Vitest, and production build all succeeded.'
              }
          }
          Path('.ai/state/TEST-STATE.yaml').write_text(json.dumps(test_state, indent=2) + '\n', encoding='utf-8')

          state_path = Path('.ai/state/CURRENT-STATE.yaml')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          assert state['execution']['active_task'] == 'TASK-0010'
          assert state['execution']['status'] == 'in_progress'
          state['quality']['continuity_validation'] = 'task_0010_pr_head_passed'
          state['quality']['application_test_status'] = 'task_0010_ci_passed'
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

      - name: Validate acceptance inputs
        run: python tools/ai_state.py validate

      - name: Transition TASK-0010 to registered TASK-0011
        run: >-
          python tools/ai_txn.py transition
          --complete TASK-0010
          --next TASK-0011
          --evidence "Exact product head 60a0b5cb7ea279898dfd861bf11ec3d43324501c passed AI Continuity Guard run 32669521904 and Application Foundation CI run 32669521928. AC-1 through AC-5 are supported by canonical workspace/contact ConsentRecord evidence with normalized channel/purpose/source and explicit decision/occurrence metadata, append-only repository contracts plus PostgreSQL mutation rejection, deterministic missing/ambiguous fail-closed effective-consent queries, transactional audit recording, and PostgreSQL lifecycle/security coverage. No PHASE-05 suppression/deliverability policy is included."
          --tests "python tools/ai_state.py validate; php artisan test; php artisan test --testsuite=Integration; composer analyse; composer lint:check; hosted AI Continuity Guard 32669521904 PASS; hosted Application Foundation CI 32669521928 PASS (php-floor, integration, e2e, foundation)."

      - name: Validate final canonical transition
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate

      - name: Require exact successor and no future implementation
        shell: python
        run: |
          import json
          from pathlib import Path
          state = json.loads(Path('.ai/state/CURRENT-STATE.yaml').read_text(encoding='utf-8'))
          completed = json.loads(Path('.ai/tasks/TASK-0010.yaml').read_text(encoding='utf-8'))
          successor = json.loads(Path('.ai/tasks/TASK-0011.yaml').read_text(encoding='utf-8'))
          assert completed['status'] == 'completed'
          assert all(item['done'] is True for item in completed['acceptance_criteria'])
          assert state['execution']['active_task'] == 'TASK-0011'
          assert state['execution']['status'] == 'ready'
          assert state['execution']['last_completed_task'] == 'TASK-0010'
          assert successor['status'] == 'ready'
          assert all(item['done'] is False for item in successor['acceptance_criteria'])

      - name: Commit accepted canonical state and remove driver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-0010-acceptance.yml
          git add .ai/tasks/TASK-0010.yaml .ai/tasks/TASK-0011.yaml .ai/tasks/INDEX.yaml .ai/roadmap/ROADMAP.yaml .ai/state/CURRENT-STATE.yaml .ai/state/TEST-STATE.yaml .ai/state/LAST-CHECKPOINT.md .ai/state/EXECUTION-JOURNAL.jsonl
          git diff --cached --check
          git commit -m "chore: accept TASK-0010 consent evidence"
          git push origin HEAD:task-0010-consent-evidence
