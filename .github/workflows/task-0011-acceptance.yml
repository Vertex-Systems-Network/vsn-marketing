name: TASK-0011 Acceptance Transition

on:
  push:
    branches:
      - task-0011-customer-events

permissions:
  contents: write

jobs:
  accept:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: task-0011-customer-events
          fetch-depth: 0

      - name: Require certified parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "de78747f20b4738434fb1a11152a3734141e0928"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/task-0011-acceptance.yml"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Validate clean canonical state before acceptance
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate

      - name: Record exact TASK-0011 acceptance evidence
        shell: python
        run: |
          import json
          from pathlib import Path

          task_path = Path('.ai/tasks/TASK-0011.yaml')
          task = json.loads(task_path.read_text(encoding='utf-8'))
          expected = {
              'AC-1': 'Canonical Event and EventType persistence uses the versioned event envelope established by TASK-0006',
              'AC-2': 'Customer events retain workspace and brand scope where applicable and reference canonical contact/identity subjects safely',
              'AC-3': 'Event ingestion is duplicate-safe by canonical event identity and does not trust provider event names or external IDs as domain identity',
              'AC-4': 'Tenant-safe contact timeline queries preserve canonical occurred/received ordering and do not expose cross-workspace events',
              'AC-5': 'Integration tests prove durable canonical event persistence, duplicate handling, subject linkage, and cross-workspace isolation',
          }
          assert task['id'] == 'TASK-0011'
          assert task['status'] == 'in_progress'
          assert {item['id']: item['text'] for item in task['acceptance_criteria']} == expected
          for item in task['acceptance_criteria']:
              item['done'] = True
          task_path.write_text(json.dumps(task, indent=2) + '\n', encoding='utf-8')

          test_state = {
              'schema_version': 1,
              'updated_for_task': 'TASK-0012',
              'suites': [
                  {
                      'name': 'ai-continuity-validation',
                      'command': 'python tools/ai_state.py validate',
                      'status': 'passing',
                      'notes': 'AI Continuity Guard run 32670383037 passed exact TASK-0011 product head de78747f20b4738434fb1a11152a3734141e0928, including transactional state, journal integrity, policy registries, deterministic context, append-only history, and product-change ledger guard.'
                  },
                  {
                      'name': 'backend-tests',
                      'command': 'php artisan test',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32670383081 passed backend tests on exact TASK-0011 head de78747f20b4738434fb1a11152a3734141e0928, including PHP 8.3 compatibility and canonical customer event feature coverage.'
                  },
                  {
                      'name': 'postgresql-integration',
                      'command': 'php artisan test --testsuite=Integration',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32670383081 integration job 97270244008 passed on PostgreSQL 18 and Redis 8, including durable Event/EventType persistence, duplicate-safe canonical event identity, contact/identity subject linkage, timeline hydration, and direct cross-workspace/wrong-contact-identity FK rejection.'
                  },
                  {
                      'name': 'php-static-analysis',
                      'command': 'composer analyse',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32670383081 foundation job 97270243912 passed Larastan on exact TASK-0011 head de78747f20b4738434fb1a11152a3734141e0928.'
                  },
                  {
                      'name': 'php-formatting',
                      'command': 'composer lint:check',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32670383081 foundation job 97270243912 passed pinned Pint formatting on exact TASK-0011 head de78747f20b4738434fb1a11152a3734141e0928.'
                  },
                  {
                      'name': 'critical-e2e',
                      'command': 'npm run test:e2e',
                      'status': 'passing',
                      'notes': 'Application Foundation CI run 32670383081 e2e job 97270244023 passed the critical Playwright smoke on exact TASK-0011 head de78747f20b4738434fb1a11152a3734141e0928.'
                  }
              ],
              'application_tests': {
                  'status': 'passing',
                  'reason': 'TASK-0011 exact product head de78747f20b4738434fb1a11152a3734141e0928 passed Application Foundation CI run 32670383081: php-floor, PostgreSQL/Redis integration, Playwright e2e, backend, architecture, Larastan, Pint, TypeScript typecheck, Vitest, and production build all succeeded.'
              }
          }
          Path('.ai/state/TEST-STATE.yaml').write_text(json.dumps(test_state, indent=2) + '\n', encoding='utf-8')

          state_path = Path('.ai/state/CURRENT-STATE.yaml')
          state = json.loads(state_path.read_text(encoding='utf-8'))
          assert state['execution']['active_task'] == 'TASK-0011'
          assert state['execution']['status'] == 'in_progress'
          state['quality']['continuity_validation'] = 'task_0011_pr_head_passed'
          state['quality']['application_test_status'] = 'task_0011_ci_passed'
          state_path.write_text(json.dumps(state, indent=2) + '\n', encoding='utf-8')

      - name: Validate acceptance inputs
        run: python tools/ai_state.py validate

      - name: Transition TASK-0011 to registered TASK-0012
        run: >-
          python tools/ai_txn.py transition
          --complete TASK-0011
          --next TASK-0012
          --evidence "Exact product head de78747f20b4738434fb1a11152a3734141e0928 passed AI Continuity Guard run 32670383037 and Application Foundation CI run 32670383081. AC-1 through AC-5 are supported by durable EventType/customer Event persistence bound to the TASK-0006 canonical envelope, composite workspace/brand/contact/contact-identity isolation, duplicate-safe internal canonical event identity with external provider IDs retained only as provenance, deterministic occurred/received contact timelines, transactional audit recording, and PostgreSQL direct-FK isolation coverage. No provider adapters or TASK-0012 certification implementation is included."
          --tests "python tools/ai_state.py validate; php artisan test; php artisan test --testsuite=Integration; composer analyse; composer lint:check; hosted AI Continuity Guard 32670383037 PASS; hosted Application Foundation CI 32670383081 PASS (php-floor, integration, e2e, foundation)."

      - name: Validate final canonical transition
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate

      - name: Require exact successor and no future implementation
        shell: python
        run: |
          import json
          from pathlib import Path
          state = json.loads(Path('.ai/state/CURRENT-STATE.yaml').read_text(encoding='utf-8'))
          completed = json.loads(Path('.ai/tasks/TASK-0011.yaml').read_text(encoding='utf-8'))
          successor = json.loads(Path('.ai/tasks/TASK-0012.yaml').read_text(encoding='utf-8'))
          assert completed['status'] == 'completed'
          assert all(item['done'] is True for item in completed['acceptance_criteria'])
          assert state['execution']['active_task'] == 'TASK-0012'
          assert state['execution']['status'] == 'ready'
          assert state['execution']['last_completed_task'] == 'TASK-0011'
          assert successor['status'] == 'ready'
          assert all(item['done'] is False for item in successor['acceptance_criteria'])

      - name: Commit accepted canonical state and remove driver
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/task-0011-acceptance.yml
          git add .ai/tasks/TASK-0011.yaml .ai/tasks/TASK-0012.yaml .ai/tasks/INDEX.yaml .ai/roadmap/ROADMAP.yaml .ai/state/CURRENT-STATE.yaml .ai/state/TEST-STATE.yaml .ai/state/LAST-CHECKPOINT.md .ai/state/EXECUTION-JOURNAL.jsonl
          git diff --cached --check
          git commit -m "chore: accept TASK-0011 customer events"
          git push origin HEAD:task-0011-customer-events
