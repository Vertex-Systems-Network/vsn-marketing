name: TASK-0011 Start

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/task-0011-start.yml'

permissions:
  contents: write

jobs:
  start:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'task-0011-customer-events'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Mark TASK-0011 in progress
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          task_path = Path('.ai/tasks/TASK-0011.yaml')
          index_path = Path('.ai/tasks/INDEX.yaml')
          state_path = Path('.ai/state/CURRENT-STATE.yaml')

          task = json.loads(task_path.read_text(encoding='utf-8'))
          index = json.loads(index_path.read_text(encoding='utf-8'))
          state = json.loads(state_path.read_text(encoding='utf-8'))

          if state['execution']['active_task'] != 'TASK-0011' or task['status'] != 'ready':
              raise SystemExit('TASK-0011 is not the ready active task; refusing to mutate canonical state')

          task['status'] = 'in_progress'
          for row in index['tasks']:
              if row['id'] == 'TASK-0011':
                  row['status'] = 'in_progress'
                  break
          else:
              raise SystemExit('TASK-0011 missing from task index')

          state['execution']['status'] = 'in_progress'
          state['blockers'] = []

          for path, payload in ((task_path, task), (index_path, index), (state_path, state)):
              path.write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Generate synchronized checkpoint
        run: |
          python tools/ai_state.py checkpoint \
            --summary "Started TASK-0011 implementation from certified main 332bbf7f459a8c97a54f071d3ca2918a67ee09c7. Scope is limited to canonical customer Event/EventType persistence bound to the TASK-0006 canonical event envelope, duplicate-safe internal event identity, tenant-safe contact subject linkage/timelines, and PostgreSQL durability/isolation coverage. No provider adapter or TASK-0012 certification work is included." \
            --next "Bind canonical customer Event/EventType persistence to the existing TASK-0006 event envelope, then add duplicate-safe contact timeline queries and tenant-isolation coverage." \
            --tests "Preflight: governance-main run 32670012288 PASS on merged TASK-0010 commit 332bbf7f459a8c97a54f071d3ca2918a67ee09c7; accepted-state head e55c7b6aeba1a1d4fa235b5e96533a779b340500 passed AI Continuity Guard 32669890652 and Application Foundation CI 32669890672. TASK-0011 product tests are pending on this branch."

      - name: Append task-start journal event
        run: |
          python tools/ai_journal.py record \
            --type task_started \
            --summary "Started TASK-0011 implementation from certified main 332bbf7f459a8c97a54f071d3ca2918a67ee09c7: canonical Event/EventType persistence using the TASK-0006 event envelope, duplicate-safe canonical event identity, contact subject timelines, and PostgreSQL durability/isolation coverage. No provider adapters or TASK-0012 certification work is included."

      - name: Validate synchronized continuity state
        run: |
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/ai_txn.py validate

      - name: Commit canonical task start
        run: |
          rm .github/workflows/task-0011-start.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ai .github/workflows/task-0011-start.yml
          git commit -m 'chore: start TASK-0011 customer events'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
