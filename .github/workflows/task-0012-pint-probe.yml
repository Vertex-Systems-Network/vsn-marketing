name: TASK-0012 Pint Probe

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  pint-probe:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'task-0012-phase-02-certification'
    runs-on: ubuntu-24.04
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LOG_CHANNEL: stderr
      SESSION_DRIVER: array
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --prefer-dist --no-progress
          touch .env

      - name: Log failing Pint state
        run: vendor/bin/pint --parallel --test || true

      - name: Apply exact repository Pint output
        run: vendor/bin/pint --parallel

      - name: Remove proven ineffective global imports
        shell: bash
        run: |
          sed -i '/^use InvalidArgumentException;$/d' tests/Unit/Consent/ConsentValueNormalizerTest.php
          sed -i '/^use DateTimeImmutable;$/d' tests/Feature/Consent/ConsentEvidenceTest.php
          sed -i -e '/^use DateTimeImmutable;$/d' -e '/^use InvalidArgumentException;$/d' tests/Feature/Events/CustomerEventPersistenceTest.php

      - name: Show exact reconciled diff
        run: |
          git status --short
          git diff -- \
            tests/Unit/Consent/ConsentValueNormalizerTest.php \
            tests/Feature/Consent/ConsentEvidenceTest.php \
            tests/Feature/Events/CustomerEventPersistenceTest.php \
            tests/Integration/ConsentEvidenceTest.php \
            tests/Integration/CustomerEventPersistenceTest.php \
            tests/Integration/Phase02CustomerDataCertificationTest.php

      - name: Require clean Pint after reconciliation
        run: vendor/bin/pint --parallel --test

      - name: Require backend tests without ineffective-import warnings
        shell: bash
        run: |
          set -o pipefail
          php artisan test --fail-on-warning --display-warnings 2>&1 | tee /tmp/task-0012-backend.log
          if grep -Fq "The use statement with non-compound name" /tmp/task-0012-backend.log; then
            echo "Ineffective global use statement warning detected after reconciliation; refusing to commit." >&2
            exit 1
          fi

      - name: Commit reconciled output and self-remove
        shell: bash
        run: |
          rm .github/workflows/task-0012-pint-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconciled changes to commit."
            exit 0
          fi
          git commit -m "style: reconcile TASK-0012 test formatting"
          git push origin HEAD:${{ github.head_ref }}
