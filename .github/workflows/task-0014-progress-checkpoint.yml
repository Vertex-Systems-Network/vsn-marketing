name: TASK-0014 Progress Checkpoint

on:
  push:
    branches:
      - task-0014-supply-chain-hardening

permissions:
  contents: write

jobs:
  checkpoint:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout task branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: task-0014-supply-chain-hardening
          fetch-depth: 0
      - name: Write repository-native checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python tools/ai_txn.py checkpoint \
            --summary "TASK-0014 exact-head acceptance CI is green on bf147299c21f1b32e43c0dde04bb4b51c850adfc: AI Continuity, Application Foundation, and Security Supply Chain CI including aggregate security-gates all passed. PR #28 is Ready for review. AC-1 remains blocked on effective main-ruleset hardening and an independent approval; TASK-0015 remains forbidden." \
            --tests "Exact-head evidence on bf147299c21f1b32e43c0dde04bb4b51c850adfc: AI Continuity Guard run 32885113890 PASS; Application Foundation CI run 32885113908 PASS; Security Supply Chain CI run 32885113941 PASS including action-integrity, dependency audit, PHP Semgrep, repository and container secret scans, critical fixed container vulnerability scan, CodeQL Actions, CodeQL JavaScript/TypeScript, reproducible SBOM, and aggregate security-gates. PR #28 has zero review threads and zero submitted independent reviews. Effective main ruleset 21212844 still has zero required approvals, last-push approval disabled, strict status checks disabled, and requires only governance." \
            --next "Have an authorized repository administrator harden main ruleset 21212844 to require governance, foundation, php-floor, integration, e2e, and security-gates with strict up-to-date checks, at least one independent approval, last-push approval, resolved threads, and no bypass/force-push/deletion path. Obtain a real independent approval on PR #28, then re-read effective ruleset and reviews. Only after AC-1 is evidenced may PR #28 merge; after merge require trusted-main Release Integrity/SBOM attestation, OpenSSF Scorecard, AI Continuity, Application Foundation, and Security Supply Chain evidence before transactionally completing TASK-0014 or activating TASK-0015."
      - name: Remove one-shot workflow and verify mutation scope
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/task-0014-progress-checkpoint.yml
          changed="$(git status --short | sed 's/^...//')"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | sort)" = "$(printf '%s\n' \
            '.ai/state/CURRENT-STATE.yaml' \
            '.ai/state/EXECUTION-JOURNAL.jsonl' \
            '.ai/state/LAST-CHECKPOINT.md' \
            '.github/workflows/task-0014-progress-checkpoint.yml' | sort)"
      - name: Commit checkpoint and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ai): checkpoint TASK-0014 green acceptance head'
          git push origin HEAD:task-0014-supply-chain-hardening
