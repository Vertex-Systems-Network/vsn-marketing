name: TASK-0014 State Reconciliation

on:
  push:
    branches:
      - task-0014-supply-chain-hardening

permissions:
  contents: write

jobs:
  reconcile:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: task-0014-supply-chain-hardening
          fetch-depth: 0
      - name: Reconcile canonical blocker state transactionally
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from tools import ai_journal, ai_state, ai_txn

          root = Path.cwd()
          state_path = root / '.ai/state/CURRENT-STATE.yaml'
          checkpoint_path = root / '.ai/state/LAST-CHECKPOINT.md'
          journal_path = root / '.ai/state/EXECUTION-JOURNAL.jsonl'
          blockers_path = root / '.ai/state/BLOCKERS.md'

          blocker = (
              'TASK-0014 AC-1: active main ruleset 21212844 still permits zero approving reviews, '
              'does not require last-push approval or strict up-to-date status checks, and requires '
              'only governance; the available GitHub connector exposes ruleset reads but no ruleset '
              'write operation, so an authorized repository-settings change is required before acceptance.'
          )
          next_action = (
              'Finish TASK-0014 security-control hardening and exact-head evidence, then have an authorized '
              'repository admin harden main ruleset 21212844 to require governance, foundation, php-floor, '
              'integration, e2e, and security-gates with strict up-to-date checks, at least one independent '
              'approval, last-push approval, and resolved review threads; re-read the effective ruleset and '
              'only then collect trusted-main Release Integrity/Scorecard evidence. Do not start TASK-0015.'
          )
          tests = (
              'State reconciliation validation: ai_state validate, ai_journal validate, and ai_context manifest '
              'run transactionally; runner-dependent application/security acceptance remains intentionally pending.'
          )
          timestamp = datetime.now(timezone.utc).isoformat(timespec='seconds')
          summary = (
              'Reconciled canonical TASK-0014 state with observed GitHub governance evidence. The AC-1 ruleset '
              'gap is now explicitly recorded as an acceptance blocker while unrelated TASK-0014 hardening may continue.'
          )

          coordinator = ai_txn.TxnCoordinator(root)
          coordinator.begin(
              'state_reconciliation',
              [state_path, checkpoint_path, journal_path, blockers_path],
          )
          try:
              state = ai_state.load_json_yaml(state_path)
              if state['execution']['active_task'] != 'TASK-0014':
                  raise RuntimeError(f"refusing reconciliation: active task is {state['execution']['active_task']}")

              # Record the observed contradiction explicitly before restoring a workable execution status.
              state['execution']['status'] = 'needs_reconciliation'
              blockers = list(state.get('blockers', []))
              if blocker not in blockers:
                  blockers.append(blocker)
              state['blockers'] = blockers
              state['exact_next_action'] = next_action
              ai_state.write_json_yaml(state_path, state)
              checkpoint_path.write_text(
                  ai_state.checkpoint_body(
                      state,
                      summary='Observed canonical mismatch: security research/operations evidence named AC-1 as a blocker while CURRENT-STATE and BLOCKERS.md reported none.',
                      tests=tests,
                      next_action=next_action,
                  ),
                  encoding='utf-8',
              )
              blockers_path.write_text(
                  '# Blockers\n\n'
                  f'## TASK-0014 — AC-1 repository governance enforcement\n\n'
                  f'- Timestamp: `{timestamp}`\n'
                  f'- Observed evidence: {blocker}\n'
                  '- Impact: TASK-0014 cannot be accepted, merged as complete, or transitioned to TASK-0015 while AC-1 is false.\n'
                  '- Attempted diagnostics: re-read effective ruleset 21212844; verified PR #28 has no approval; searched available GitHub connector capabilities for ruleset/branch-protection writes and found read-only fetch support only.\n'
                  '- Decision/input required: an authorized repository administrator must apply the documented target main ruleset and the effective rule must then be re-read as acceptance evidence.\n'
                  '- Unrelated work: remaining TASK-0014 static hardening and final CI evidence may safely continue; provider/TASK-0015 work may not.\n',
                  encoding='utf-8',
              )
              ai_journal.record('manual_sync', 'TASK-0014 entered needs_reconciliation because canonical blocker records disagreed with observed AC-1 governance evidence.')
              ai_txn.validate_integrity()

              # Ledger is now reconciled. Resume the still-active task while retaining the real acceptance blocker.
              state = ai_state.load_json_yaml(state_path)
              state['execution']['status'] = 'ready'
              ai_state.write_json_yaml(state_path, state)
              checkpoint_path.write_text(
                  ai_state.checkpoint_body(
                      state,
                      summary=summary,
                      tests=tests,
                      next_action=next_action,
                  ),
                  encoding='utf-8',
              )
              ai_journal.record('recovery', 'Canonical TASK-0014 blocker ledger reconciled; execution returned to ready with AC-1 blocker preserved explicitly.')
              ai_txn.validate_integrity()
          except BaseException:
              coordinator.restore_pending(force=True)
              raise
          coordinator.commit()
          PY
      - name: Verify reconciliation mutation scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | sort)" = "$(printf '%s\n' \
            '.ai/state/BLOCKERS.md' \
            '.ai/state/CURRENT-STATE.yaml' \
            '.ai/state/EXECUTION-JOURNAL.jsonl' \
            '.ai/state/LAST-CHECKPOINT.md' | sort)"
      - name: Commit reconciled canonical state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ai/state/BLOCKERS.md .ai/state/CURRENT-STATE.yaml .ai/state/EXECUTION-JOURNAL.jsonl .ai/state/LAST-CHECKPOINT.md
          git commit -m 'chore(ai): reconcile TASK-0014 blocker state'
          git push origin HEAD:task-0014-supply-chain-hardening
