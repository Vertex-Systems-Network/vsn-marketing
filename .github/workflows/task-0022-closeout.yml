name: TASK-0022 Transactional Closeout

on:
  push:
    branches:
      - supervisor/task-0022-parallel-integration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task-0022-transactional-closeout
  cancel-in-progress: false

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: supervisor/task-0022-parallel-integration
          fetch-depth: 0
          persist-credentials: true

      - name: Verify expected implementation head ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6e271bcad4324694e43b50ae879e59bc76278ada HEAD
          python tools/ai_txn.py recover
          python tools/ai_txn.py validate
          python tools/ai_policy.py
          python tools/ai_parallel.py validate
          python tools/ai_parallel.py sync-check

      - name: Complete TASK-0022 atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          ROOT = Path.cwd()
          sys.path.insert(0, str(ROOT / 'tools'))
          import ai_txn

          task = ROOT / '.ai/tasks/TASK-0022.yaml'
          paths = [
              task,
              ROOT / '.ai/tasks/INDEX.yaml',
              ROOT / '.ai/roadmap/ROADMAP.yaml',
              ROOT / '.ai/state/CURRENT-STATE.yaml',
              ROOT / '.ai/state/LAST-CHECKPOINT.md',
              ROOT / '.ai/state/EXECUTION-JOURNAL.jsonl',
          ]
          coordinator = ai_txn.TxnCoordinator(ROOT)
          coordinator.begin('task_transition', paths)
          evidence = (
              'TASK-0022 provider-neutral retry classification, tenant-scoped circuit breakers, durable dead-letter and reconciliation semantics, '
              'explicit compatible failover, and fail-closed tenant isolation are implemented; the alternate-route lookup is tenant-scoped before row locking.'
          )
          tests = (
              'Implementation head 6e271bcad4324694e43b50ae879e59bc76278ada: AI Continuity Guard run 34506451079 SUCCESS; '
              'Application Foundation CI run 34506451114 SUCCESS; PostgreSQL 18 + Redis 8 integration job 102969994917 SUCCESS '
              '(40 tests, 233 assertions, including accepted-vs-failover serialization and single-winner concurrent failover); '
              'Security Supply Chain CI run 34506451107 SUCCESS.'
          )
          try:
              payload = json.loads(task.read_text(encoding='utf-8'))
              if payload.get('id') != 'TASK-0022' or payload.get('status') != 'ready':
                  raise RuntimeError('TASK-0022 is not the expected active ready task')
              criteria = payload.get('acceptance_criteria', [])
              if not criteria or {item.get('id') for item in criteria} != {f'AC-{i}' for i in range(1, 8)}:
                  raise RuntimeError('TASK-0022 acceptance criteria set is unexpected')
              for item in criteria:
                  item['done'] = True
              task.write_text(json.dumps(payload, indent=2) + '\n', encoding='utf-8')

              ai_txn.run_tool([
                  'tools/ai_state.py', 'transition',
                  '--complete', 'TASK-0022',
                  '--evidence', evidence,
                  '--tests', tests,
              ])
              ai_txn.run_tool([
                  'tools/ai_journal.py', 'record',
                  '--type', 'task_transition',
                  '--summary', f'TASK-0022 completed; no successor registered. {evidence}',
              ])
              ai_txn.validate_integrity()
          except BaseException:
              coordinator.restore_pending(force=True)
              raise
          coordinator.commit()
          PY

          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/ai_policy.py
          python tools/ai_context.py manifest >/dev/null

      - name: Commit canonical closeout state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ai/tasks/TASK-0022.yaml .ai/tasks/INDEX.yaml .ai/roadmap/ROADMAP.yaml .ai/state/CURRENT-STATE.yaml .ai/state/LAST-CHECKPOINT.md .ai/state/EXECUTION-JOURNAL.jsonl
          if git diff --cached --quiet; then
            echo 'No closeout changes to commit.'
            exit 0
          fi
          git commit -m 'control: complete TASK-0022 recovery acceptance'
          git push origin HEAD:supervisor/task-0022-parallel-integration
