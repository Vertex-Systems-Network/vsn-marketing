name: TASK-0022 Pint Autofix

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: task-0022-pint-autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pint-autofix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'supervisor/task-0022-parallel-integration' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Apply canonical Laravel Pint formatting
        run: vendor/bin/pint --parallel
      - name: Commit formatter-only changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Pint produced no changes."
            exit 0
          fi
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.php'
          if git diff --cached --quiet; then
            echo "No PHP formatter changes to commit."
            exit 0
          fi
          git commit -m "style(delivery): apply Pint formatting"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
