name: TASK-0024 Guarded Transition Once

on:
  push:
    branches:
      - supervisor/task-0024-final-closeout-activate
    paths:
      - .github/workflows/task0024-transition-once.yml

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Supervisor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: supervisor/task-0024-final-closeout-activate
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Recover and validate continuity before transition
        run: |
          python tools/ai_txn.py recover
          python tools/ai_txn.py validate
          python tools/ai_state.py recover
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/ai_policy.py
          python tools/ai_parallel.py validate
      - name: Execute guarded transition
        run: |
          python tools/ai_txn.py transition \
            --complete TASK-0024 \
            --next TASK-0025 \
            --evidence "TASK-0024 AC-1 through AC-7 are true; approved v7 threshold manifest and canonical SLO closeout are merged; clean-checkout TASK-0024 final certification and exact-head acceptance gates passed; TASK-0025 research successor is registered on main." \
            --tests "TASK-0024 Final Certification PASS; AI Continuity Guard PASS; Application Foundation CI PASS; Security Supply Chain CI PASS; Release Integrity PASS on accepted main heads."
      - name: Reconcile completed TASK-0024 parallel cycle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          workstreams_path = Path('.ai/parallel/WORKSTREAMS.yaml')
          leases_path = Path('.ai/parallel/AGENT-LEASES.yaml')
          registry = json.loads(workstreams_path.read_text(encoding='utf-8'))
          registry['mode'] = 'staged'
          terminal_ids = {
              'WS-0024-THRESHOLD-CLOSEOUT',
              'WS-0024-CONTROL-ACTIVATION',
          }
          for row in registry.get('workstreams', []):
              if row.get('id') in terminal_ids:
                  row['status'] = 'merged'
                  row['start_status'] = 'completed'
          workstreams_path.write_text(json.dumps(registry, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          leases = json.loads(leases_path.read_text(encoding='utf-8'))
          leases['leases'] = []
          leases_path.write_text(json.dumps(leases, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
      - name: Validate transaction result
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/ai_policy.py
          python tools/ai_parallel.py validate
          python tools/ai_context.py manifest > /tmp/vsn-ai-context-manifest.json
      - name: Commit transaction output and remove one-shot workflow
        run: |
          rm .github/workflows/task0024-transition-once.yml
          git config user.name "VSN Supervisor Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .ai .github/workflows/task0024-transition-once.yml
          if git diff --cached --quiet; then
            echo "Guarded transition produced no repository delta." >&2
            exit 1
          fi
          git commit -m "control: record TASK-0024 guarded transition to TASK-0025"
          git push origin HEAD:supervisor/task-0024-final-closeout-activate
