name: TASK-0025 Guarded Transition Once

on:
  push:
    branches:
      - supervisor/task-0025-to-0026-transition

permissions:
  contents: write

jobs:
  transition:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout Supervisor branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: supervisor/task-0025-to-0026-transition
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Validate continuity before transition
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/ai_policy.py
          python tools/ai_parallel.py validate

      - name: Execute guarded transition
        run: python tools/ai_txn.py transition --complete TASK-0025 --next TASK-0026

      - name: Validate transaction result
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/ai_policy.py
          python tools/ai_parallel.py validate
          python tools/ai_context.py manifest

      - name: Commit transaction output and remove one-shot workflow
        run: |
          git config user.name "WPEssential"
          git config user.email "wordpress.essential@gmail.com"
          git rm .github/workflows/task0025-transition-once.yml
          git add .ai
          git diff --cached --exit-code && { echo "No transaction delta produced"; exit 1; } || true
          git commit -m "control: transition TASK-0025 to TASK-0026"
          git push origin HEAD:supervisor/task-0025-to-0026-transition
