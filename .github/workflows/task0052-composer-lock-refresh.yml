name: TASK-0052 Composer lock refresh evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none
      - name: Refresh vulnerable package lock entries
        run: composer update laravel/framework league/commonmark --with-all-dependencies --no-interaction --no-progress --no-scripts
      - name: Audit refreshed lock
        run: composer audit --locked --no-interaction --abandoned=report
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task0052-refreshed-composer-lock
          path: composer.lock
          retention-days: 1
