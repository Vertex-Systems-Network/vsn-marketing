name: Temporary TASK-0091 Final Certification Evidence 564

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  task0091-final-certification-evidence:
    if: github.head_ref == 'supervisor/task0091-certification-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Prepare official journal and certify TASK-0091
        run: |
          python tools/ai_journal.py compact
          python tools/ai_txn.py checkpoint \
            --active-pr 564 \
            --active-branch supervisor/task0091-certification-20261012 \
            --observed-main d5030edd11c2c2293be8563f3e74c2aedd13bb94 \
            --carrier-title 'chore(phase15): certify TASK-0091 offline canary safety and unlock red-team' \
            --completed-pr 563 \
            --completion-sha d5030edd11c2c2293be8563f3e74c2aedd13bb94 \
            --summary 'PR #563 offline rollback capture chronology passed full exact-head and protected-main CI; certification PR #564 maps TASK-0091 AC-1 to AC-3 to independently bounded offline evidence.' \
            --tests 'PR #563 exact-head and protected-main Foundation, PHP 8.3, PostgreSQL, E2E, Security, Governance, Release Integrity and Scorecard passed.' \
            --next 'Certify TASK-0091 AC-1 to AC-3 offline-only, transition via official tool, then require exact-head/full CI for PR #564.'
          python tools/ai_txn.py transition \
            --complete TASK-0091 \
            --next TASK-0092 \
            --criteria AC-1 \
            --criteria AC-2 \
            --criteria AC-3 \
            --evidence 'Offline-only TASK-0091 AC-1 frozen consent-safe holdouts and denominators PRs 541-543/556-559; AC-2 independent scored manifests and human review PRs 546-550/562; AC-3 immutable rollback/provider attempt, costs, chronology, stale replay PRs 544-545/551-555/560-561/563. No external execution authority. See TASK-0091-CERTIFICATION.md.' \
            --tests 'Full exact-head and protected-main Foundation, PHP 8.3, PostgreSQL, E2E, Security, Governance, Release Integrity, Scorecard for PR #563 at d5030edd11c2c2293be8563f3e74c2aedd13bb94; PR #564 full gate required before merge.'
          python tools/ai_txn.py checkpoint \
            --milestone TASK-0092-PHASE15-REDTEAM \
            --milestone-status IN_PROGRESS \
            --summary 'TASK-0091 AC-1/2/3 accepted as OFFLINE deterministic contracts; TASK-0092 staged READY for red-team and incident monitoring. PR #564 is pending its own exact-head/protected-main CI.' \
            --tests 'TASK-0091 implementation PRs #541-#563 tested and protected-main green through d5030edd; PR #564 full certification validation pending.' \
            --next 'Start TASK-0092 offline autonomy red-team and incident-monitoring tests after PR #564 guarded merge and main verification. Do not authorize external sending, promotion, spending or rollback.'
      - name: Sync README deterministic progress mirror
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          body = p.read_text()
          required = {
              '<!-- AI_PROGRESS_SNAPSHOT roadmap=94.4 phase=60 current_phase=PHASE-15 active_task=TASK-0091 milestone=TASK-0091-PHASE15-OFFLINE-CANARIES status=IN_PROGRESS -->': '<!-- AI_PROGRESS_SNAPSHOT roadmap=95 phase=75 current_phase=PHASE-15 active_task=TASK-0092 milestone=TASK-0092-PHASE15-REDTEAM status=IN_PROGRESS -->',
              '**Overall roadmap progress: 94.40%**': '**Overall roadmap progress: 95.00%**',
              '**Current phase: PHASE-15 — 60.00%**': '**Current phase: PHASE-15 — 75.00%**',
              '**Last completed task: TASK-0090**': '**Last completed task: TASK-0091**',
              '**Current milestone: TASK-0091-PHASE15-OFFLINE-CANARIES — IN_PROGRESS**': '**Current milestone: TASK-0092-PHASE15-REDTEAM — IN_PROGRESS**',
              ' Overall  [███████████████████░] 94.40%': ' Overall  [███████████████████░] 95.00%',
              'Phase 15 [████████████░░░░░░░░] 60.00%': 'Phase 15 [███████████████░░░░░] 75.00%',
          }
          for old, new in required.items():
              if body.count(old) != 1:
                  raise SystemExit(f'README exact marker not unique: {old}')
              body = body.replace(old, new, 1)
          rows = body.splitlines(keepends=True)
          matches = [i for i, line in enumerate(rows) if line.startswith('| PHASE-15 |')]
          if len(matches) != 1:
              raise SystemExit('PHASE-15 README row must exist exactly once')
          rows[matches[0]] = '| PHASE-15 | 4% | Bounded autonomous marketing loops, budgets, kill switch, canaries | ✅ TASK-0091 offline-only canary/rollback certified; TASK-0092 red-team READY | 75% |\n'
          body = ''.join(rows)
          old_tail = 'This next AC-2 slice stages independently scored source-manifest integrity, with full CI required. TASK-0091 is still IN_PROGRESS and all production/provider effect authority remains disabled.'
          new_tail = 'PR #562 certified independently scored canary outcome manifests and PR #563 certified conservative provider capture chronology with full exact-head/protected-main CI. TASK-0091 AC-1..3 are accepted as OFFLINE ONLY through the guarded PR #564 certification carrier; TASK-0092 red-team is READY. No external provider authentication or execution authority is inferred.'
          if body.count(old_tail) != 1:
              raise SystemExit('README old TASK-0091 tail not unique')
          body = body.replace(old_tail, new_tail, 1)
          p.write_text(body)
          PY
      - name: Validate official continuity task and README evidence
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/supervisor_contract.py validate
          python tools/supervisor_contract.py validate-main-observation --current-main d5030edd11c2c2293be8563f3e74c2aedd13bb94
      - name: Export exact derived evidence, without git credentials
        run: |
          python - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          import base64
          changed = set(check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          added = set(check_output(['git', 'ls-files', '--others', '--exclude-standard', '.ai/state/archive'], text=True).splitlines())
          paths = sorted(changed | added)
          required = {
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
              '.ai/coordination/OPEN-WORK-QUEUE.yaml',
              '.ai/tasks/TASK-0091.yaml',
              '.ai/tasks/TASK-0092.yaml',
              '.ai/tasks/INDEX.yaml',
              'README.md',
          }
          if not required.issubset(paths):
              raise SystemExit(f'Missing generated evidence paths: {sorted(required - set(paths))}')
          if any(p not in required and not p.startswith('.ai/state/archive/EXECUTION-JOURNAL-') for p in paths):
              raise SystemExit(f'Unexpected modified paths: {paths}')
          for name in paths:
              print(f'VSN_EVIDENCE_BEGIN::{name}')
              data = base64.b64encode(Path(name).read_bytes()).decode('ascii')
              for i in range(0, len(data), 160):
                  print('VSN_EVIDENCE_CHUNK::' + data[i:i+160])
              print(f'VSN_EVIDENCE_END::{name}')
          PY
