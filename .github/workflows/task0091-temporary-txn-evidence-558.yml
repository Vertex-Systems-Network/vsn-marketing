name: Temporary TASK-0091 Transaction Evidence 558

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transactional-checkpoint-evidence:
    if: github.head_ref == 'supervisor/task0091-exposure-consent-chronology-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Generate official TASK-0091 checkpoint
        run: |
          python tools/ai_txn.py checkpoint \
            --active-pr 558 \
            --active-branch supervisor/task0091-exposure-consent-chronology-20261011 \
            --observed-main 0f28b6079b523ec231ff75d585a0c094e22f23c1 \
            --carrier-title 'fix(phase15): bind canary exposures and consent observation order to outcome proof' \
            --completed-pr 557 \
            --completion-sha 0f28b6079b523ec231ff75d585a0c094e22f23c1 \
            --summary 'PR #557 independently frozen per-arm assignment readback passed exact-head Foundation, PHP 8.3, PostgreSQL integration, E2E, Security and Governance; merged 0f28b6079b523ec231ff75d585a0c094e22f23c1. PR #558 stages exposure parity and consent/outcome observation chronology without effect authority.' \
            --tests 'PR #557 required exact-head checks PASS; PR #558 full CI pending. Protected main check tracked independently.' \
            --next 'Certify PR #558 exact-head exposure parity and temporal outcome/consent consistency with Foundation, PHP floor, PostgreSQL, E2E, Security and Governance, then merge guarded if green.'
      - name: Export exact transaction artifacts for scoped recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for name in (
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
              '.ai/coordination/OPEN-WORK-QUEUE.yaml',
          ):
              print(f'VSN_EVIDENCE_BEGIN::{name}')
              data = base64.b64encode(Path(name).read_bytes()).decode('ascii')
              for i in range(0, len(data), 160):
                  print('VSN_EVIDENCE_CHUNK::' + data[i:i+160])
              print(f'VSN_EVIDENCE_END::{name}')
          PY
