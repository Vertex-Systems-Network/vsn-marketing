name: Temporary TASK-0091 Transaction Evidence 559

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transactional-checkpoint-evidence:
    if: github.head_ref == 'supervisor/task0091-durable-arm-commitment-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Generate official TASK-0091 checkpoint
        run: |
          python tools/ai_txn.py checkpoint \
            --active-pr 559 \
            --active-branch supervisor/task0091-durable-arm-commitment-20261011 \
            --observed-main 45d538deeaac8c69de12e1565c61cffe3e54c2ad \
            --carrier-title 'feat(phase15): persist frozen per-arm assignment checksum in offline receipt' \
            --completed-pr 558 \
            --completion-sha 45d538deeaac8c69de12e1565c61cffe3e54c2ad \
            --summary 'PR #558 exposure and consent observation chronology passed exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance, merged 45d538deeaac8c69de12e1565c61cffe3e54c2ad. PR #559 stages nullable additive durable arm checksum, immutable replay/legacy safety and migration tests without external authority.' \
            --tests 'PR #558 full exact-head checks passed, protected-main follow-up separate. PR #559 full CI pending.' \
            --next 'Certify PR #559 frozen per-arm receipt checksum migration, exact-head Foundation, PHP floor, PostgreSQL, E2E, Security and Governance; repair and merge guarded when green, then continue TASK-0091 acceptance.'
      - name: Export exact transaction artifacts for scoped recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for name in (
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
              '.ai/coordination/OPEN-WORK-QUEUE.yaml',
          ):
              print(f'VSN_EVIDENCE_BEGIN::{name}')
              data = base64.b64encode(Path(name).read_bytes()).decode('ascii')
              for i in range(0, len(data), 160):
                  print('VSN_EVIDENCE_CHUNK::' + data[i:i+160])
              print(f'VSN_EVIDENCE_END::{name}')
          PY
