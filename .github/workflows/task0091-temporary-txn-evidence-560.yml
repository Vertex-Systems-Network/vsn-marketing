name: Temporary TASK-0091 Transaction Evidence 560

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transactional-checkpoint-evidence:
    if: github.head_ref == 'supervisor/task0091-ledger-stale-positive-replay-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch safely
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Reconcile official TASK-0091 carrier checkpoint
        run: |
          python tools/ai_txn.py checkpoint \
            --active-pr 560 \
            --active-branch supervisor/task0091-ledger-stale-positive-replay-20261011 \
            --observed-main aa35ba246a7335e1a68047c610bb83a415135c37 \
            --carrier-title 'fix(phase15): stale positive rollback replay cannot override newer hold' \
            --completed-pr 559 \
            --completion-sha aa35ba246a7335e1a68047c610bb83a415135c37 \
            --summary 'PR #559 durable frozen per-arm commitment passed exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance; merged aa35ba246a7335e1a68047c610bb83a415135c37. PR #560 hardens rollback ledger against replaying a historical positive after a later irreversible hold, with feature regressions.' \
            --tests 'PR #559 full exact-head checks PASS. Protected-main CI independently verified/pending. PR #560 exact-head CI pending.' \
            --next 'Certify PR #560 stale positive replay test, exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance; guarded merge on pass, continue TASK-0091 holistic acceptance.'
      - name: Export exact transaction evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for name in (
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
              '.ai/coordination/OPEN-WORK-QUEUE.yaml',
          ):
              print(f'VSN_EVIDENCE_BEGIN::{name}')
              data = base64.b64encode(Path(name).read_bytes()).decode('ascii')
              for i in range(0, len(data), 160):
                  print('VSN_EVIDENCE_CHUNK::' + data[i:i+160])
              print(f'VSN_EVIDENCE_END::{name}')
          PY
