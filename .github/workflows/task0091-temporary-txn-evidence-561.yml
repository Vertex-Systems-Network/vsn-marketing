name: Temporary TASK-0091 Transaction Evidence 561

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transactional-checkpoint-evidence:
    if: github.head_ref == 'supervisor/task0091-aggregate-provider-manifest-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Generate official TASK-0091 continuity checkpoint
        run: |
          python tools/ai_txn.py checkpoint \
            --active-pr 561 \
            --active-branch supervisor/task0091-aggregate-provider-manifest-20261011 \
            --observed-main ac8a2628ecb4f1d0b266178995c6c72aa9ac67c4 \
            --carrier-title 'fix(phase15): bind aggregate provider outcome to canonical source manifest' \
            --completed-pr 560 \
            --completion-sha ac8a2628ecb4f1d0b266178995c6c72aa9ac67c4 \
            --summary 'PR #560 fixed stale-positive rollback review replay, passed exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance; merged ac8a2628ecb4f1d0b266178995c6c72aa9ac67c4 with resulting-main required gates. PR #561 binds aggregate provider outcome to its canonical checksum, still offline-only.' \
            --tests 'PR #560 exact-head and resulting-main required checks PASS. PR #561 full exact-head CI pending.' \
            --next 'Certify PR #561 aggregate provider source manifest tampering regressions on Foundation, PHP floor, PostgreSQL, E2E, Security and Governance; repair, guarded merge and continue TASK-0091 acceptance.'
      - name: Export exact continuity artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for name in (
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
              '.ai/coordination/OPEN-WORK-QUEUE.yaml',
          ):
              print(f'VSN_EVIDENCE_BEGIN::{name}')
              data = base64.b64encode(Path(name).read_bytes()).decode('ascii')
              for i in range(0, len(data), 160):
                  print('VSN_EVIDENCE_CHUNK::' + data[i:i+160])
              print(f'VSN_EVIDENCE_END::{name}')
          PY
