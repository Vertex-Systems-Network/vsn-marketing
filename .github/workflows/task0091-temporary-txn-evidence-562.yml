name: Temporary TASK-0091 Transaction Evidence 562

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transactional-checkpoint-evidence:
    if: github.head_ref == 'supervisor/task0091-canary-score-manifest-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Generate official TASK-0091 continuity checkpoint
        run: |
          python tools/ai_txn.py checkpoint \
            --active-pr 562 \
            --active-branch supervisor/task0091-canary-score-manifest-20261011 \
            --observed-main 444516eedcaddb431cf2d593d713324be9b4cb94 \
            --carrier-title 'fix(phase15): bind scored canary evidence to outcome source manifest' \
            --completed-pr 561 \
            --completion-sha 444516eedcaddb431cf2d593d713324be9b4cb94 \
            --summary 'PR #561 canonical aggregate provider manifest completed with full exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance and merged 444516eedcaddb431cf2d593d713324be9b4cb94. PR #562 stages scored canary source manifest binding, negative tamper tests and truthful README/frontier reconciliation; no live effects.' \
            --tests 'PR #561 full exact-head required checks passed. PR #562 exact-head full CI pending; resulting-main follow-up distinct.' \
            --next 'Certify PR #562 canary source manifest and adversarial denominators/conversion tests using Foundation, PHP floor, PostgreSQL, E2E, Security and Governance; repair and merge verified head only, continue TASK-0091 safe work.'
      - name: Export exact continuity artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for name in (
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
              '.ai/coordination/OPEN-WORK-QUEUE.yaml',
          ):
              print(f'VSN_EVIDENCE_BEGIN::{name}')
              data = base64.b64encode(Path(name).read_bytes()).decode('ascii')
              for i in range(0, len(data), 160):
                  print('VSN_EVIDENCE_CHUNK::' + data[i:i+160])
              print(f'VSN_EVIDENCE_END::{name}')
          PY
