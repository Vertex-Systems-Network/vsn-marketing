name: Temporary TASK-0091 Transaction Evidence 563

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transactional-checkpoint-evidence:
    if: github.head_ref == 'supervisor/task0091-rollback-capture-order-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Generate official TASK-0091 continuity checkpoint
        run: |
          python tools/ai_txn.py checkpoint \
            --active-pr 563 \
            --active-branch supervisor/task0091-rollback-capture-order-20261012 \
            --observed-main 01b65fd0370bd8bfd79bdbfc7d4762e3d3ae79f4 \
            --carrier-title 'fix(phase15): hold stale aggregate rollback when provider evidence was captured later' \
            --completed-pr 562 \
            --completion-sha 01b65fd0370bd8bfd79bdbfc7d4762e3d3ae79f4 \
            --summary 'PR #562 complete on 01b65fd with full exact-head and resulting-main CI. PR #563 stages conservative provider-capture chronology under TASK-0091 AC-3, offline only.' \
            --tests 'PR #562 full exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security, Governance and resulting-main checks PASS; PR #563 exact-head CI pending.' \
            --next 'Certify PR #563 provider capture chronology regressions with full exact-head CI; guarded merge and protected-main validation, then continue TASK-0091 AC-1..3 acceptance.'
      - name: Export exact continuity artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          for name in (
              '.ai/state/CURRENT-STATE.yaml',
              '.ai/state/LAST-CHECKPOINT.md',
              '.ai/state/EXECUTION-JOURNAL.jsonl',
              '.ai/coordination/OPEN-WORK-QUEUE.yaml',
          ):
              print(f'VSN_EVIDENCE_BEGIN::{name}')
              data = base64.b64encode(Path(name).read_bytes()).decode('ascii')
              for i in range(0, len(data), 160):
                  print('VSN_EVIDENCE_CHUNK::' + data[i:i+160])
              print(f'VSN_EVIDENCE_END::{name}')
          PY
