name: Temporary TASK-0092 Monitor Pint Evidence 569

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  php-pint-evidence:
    if: github.head_ref == 'supervisor/task0092-operator-audit-monitor-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up PHP 8.5
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, pdo_pgsql, redis, pcntl, posix
          coverage: none
      - name: Install locked PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Format affected monitor feature test with canonical Pint
        run: |
          vendor/bin/pint tests/Feature/AI/DatabaseBoundedAutonomyOfflineRedTeamAuditTest.php
          vendor/bin/pint --test tests/Feature/AI/DatabaseBoundedAutonomyOfflineRedTeamAuditTest.php
      - name: Export formatted source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          name='tests/Feature/AI/DatabaseBoundedAutonomyOfflineRedTeamAuditTest.php'
          print(f'VSN_PINT_BEGIN::{name}')
          encoded=base64.b64encode(Path(name).read_bytes()).decode('ascii')
          for index in range(0,len(encoded),160):
              print('VSN_PINT_CHUNK::'+encoded[index:index+160])
          print(f'VSN_PINT_END::{name}')
          PY
