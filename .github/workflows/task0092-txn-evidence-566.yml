name: Temporary TASK-0092 Transaction Evidence 566

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  task0092-checkpoint-evidence:
    if: github.head_ref == 'supervisor/task0092-offline-redteam-audit-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Update active TASK-0092 descriptive frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.ai/tasks/TASK-0092.yaml')
          task=json.loads(p.read_text())
          assert task['id']=='TASK-0092' and task['status']=='ready'
          assert 'PR #565' in task['exact_next_action']
          task['exact_next_action']='Certify PR #566 synthetic red-team append-only audit, replay holds, actor/tenant authorization, no incident/recovery authority via exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance; guarded merge, then continue TASK-0092 quota/stop race stress and human incident workflows.'
          p.write_text(json.dumps(task,indent=2)+'\n')
          PY
      - name: Generate canonical TASK-0092 checkpoint
        run: |
          python tools/ai_journal.py compact
          python tools/ai_txn.py checkpoint \
            --active-pr 566 \
            --active-branch supervisor/task0092-offline-redteam-audit-20261012 \
            --observed-main 9508a7a55b682ceaf14b1165331b9a583a890ee8 \
            --carrier-title 'feat(phase15): audit synthetic red-team evidence with replay-safe holds' \
            --completed-pr 565 \
            --completion-sha 9508a7a55b682ceaf14b1165331b9a583a890ee8 \
            --summary 'PR #565 implemented synthetic offline red-team evidence and prompt/tool misuse fixtures; all exact-head Foundation, PHP, PostgreSQL, E2E, Security and Governance checks passed; PR #566 stages scoped append-only audit and replay safety.' \
            --tests 'PR #565 exact-head full Foundation, PHP floor, PostgreSQL, browser E2E, Security, Governance PASS; resulting-main security/release/governance PASS, PR #566 exact-head CI pending.' \
            --next 'Certify PR #566 synthetic red-team append-only audit, replay holds, actor/tenant authorization, no incident/recovery authority via exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance; guarded merge, then continue TASK-0092 quota/stop race stress and human incident workflows.'
      - name: Validate checkpoint and task integrity
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/supervisor_contract.py validate
          python tools/supervisor_contract.py validate-main-observation --current-main 9508a7a55b682ceaf14b1165331b9a583a890ee8
      - name: Export official state changes
        run: |
          python - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          import base64
          edited=set(check_output(['git','diff','--name-only'],text=True).splitlines())
          added=set(check_output(['git','ls-files','--others','--exclude-standard','.ai/state/archive'],text=True).splitlines())
          paths=sorted(edited|added)
          needed={'.ai/state/CURRENT-STATE.yaml','.ai/state/LAST-CHECKPOINT.md','.ai/state/EXECUTION-JOURNAL.jsonl','.ai/coordination/OPEN-WORK-QUEUE.yaml','.ai/tasks/TASK-0092.yaml'}
          if not needed.issubset(paths):
              raise SystemExit(f'Missing evidence files: {sorted(needed-set(paths))}')
          if any(p not in needed and not p.startswith('.ai/state/archive/EXECUTION-JOURNAL-') for p in paths):
              raise SystemExit(f'Unexpected evidence file: {paths}')
          for path in paths:
              print(f'VSN_EVIDENCE_BEGIN::{path}')
              raw=base64.b64encode(Path(path).read_bytes()).decode('ascii')
              for i in range(0,len(raw),160):
                  print('VSN_EVIDENCE_CHUNK::'+raw[i:i+160])
              print(f'VSN_EVIDENCE_END::{path}')
          PY
