name: Temporary TASK-0092 Transaction Evidence 567

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  task0092-checkpoint-evidence:
    if: github.head_ref == 'supervisor/task0092-quota-rate-4worker-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Set accepted TASK-0092 next action
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('.ai/tasks/TASK-0092.yaml')
          task=json.loads(p.read_text())
          assert task['id']=='TASK-0092' and task['status']=='ready'
          assert 'PR #566' in task['exact_next_action']
          task['exact_next_action']='Certify PR #567 four-worker PostgreSQL quota/rate stress with one offline claim and three fail-closed holds via full exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance; guarded merge, then continue TASK-0092 provider/queue failure and incident recovery adversarial work.'
          p.write_text(json.dumps(task,indent=2)+'\n')
          PY
      - name: Produce official TASK-0092 transaction checkpoint
        run: |
          python tools/ai_journal.py compact
          python tools/ai_txn.py checkpoint \
            --active-pr 567 \
            --active-branch supervisor/task0092-quota-rate-4worker-20261012 \
            --observed-main 43b8f3215089174442eec58de695e3f8228c7c67 \
            --carrier-title 'test(phase15): stress four offline autonomy workers against quota and rate caps' \
            --completed-pr 566 \
            --completion-sha 43b8f3215089174442eec58de695e3f8228c7c67 \
            --summary 'PR #566 merged to protected main 43b8f321: canonical replay-safe synthetic red-team audit with exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance PASS. PR #567 stages four-worker quota/rate stress while resulting-main checks finish.' \
            --tests 'PR #566 exact-head full application, PostgreSQL, browser E2E, security and governance PASS; PR #567 exact-head pending and protected main 43b8f321 checks in progress.' \
            --next 'Certify PR #567 four-worker PostgreSQL quota/rate stress with one offline claim and three fail-closed holds via full exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance; guarded merge, then continue TASK-0092 provider/queue failure and incident recovery adversarial work.'
      - name: Validate official continuity
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/supervisor_contract.py validate
          python tools/supervisor_contract.py validate-main-observation --current-main 43b8f3215089174442eec58de695e3f8228c7c67
      - name: Export generated official artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          import base64
          changed=set(check_output(['git','diff','--name-only'],text=True).splitlines())
          added=set(check_output(['git','ls-files','--others','--exclude-standard','.ai/state/archive'],text=True).splitlines())
          paths=sorted(changed|added)
          required={'.ai/state/CURRENT-STATE.yaml','.ai/state/LAST-CHECKPOINT.md','.ai/state/EXECUTION-JOURNAL.jsonl','.ai/coordination/OPEN-WORK-QUEUE.yaml','.ai/tasks/TASK-0092.yaml'}
          if not required.issubset(paths):
              raise SystemExit(f'Missing official evidence: {sorted(required-set(paths))}')
          if any(p not in required and not p.startswith('.ai/state/archive/EXECUTION-JOURNAL-') for p in paths):
              raise SystemExit(f'Unexpected generated path: {paths}')
          for path in paths:
              print(f'VSN_EVIDENCE_BEGIN::{path}')
              raw=base64.b64encode(Path(path).read_bytes()).decode('ascii')
              for i in range(0,len(raw),160):
                  print('VSN_EVIDENCE_CHUNK::'+raw[i:i+160])
              print(f'VSN_EVIDENCE_END::{path}')
          PY
