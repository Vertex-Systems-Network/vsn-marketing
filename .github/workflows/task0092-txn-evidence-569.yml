name: Temporary TASK-0092 Transaction Evidence 569

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  task0092-checkpoint-evidence:
    if: github.head_ref == 'supervisor/task0092-operator-audit-monitor-20261012'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Reconcile TASK-0092 current frontier
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('.ai/tasks/TASK-0092.yaml')
          task=json.loads(path.read_text())
          assert task['id']=='TASK-0092' and task['status']=='ready'
          assert 'PR #568' in task['exact_next_action']
          assert not any(x['done'] for x in task['acceptance_criteria'])
          task['exact_next_action']='Certify PR #569 read-only synthetic incident operator monitor, tenant/brand permission checks and hold-preserving audit chain via full exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance; guarded merge, then continue TASK-0092 human incident and provider-failure red-team evidence.'
          path.write_text(json.dumps(task,indent=2)+'\n')
          PY
      - name: Produce official continuity checkpoint
        run: |
          python tools/ai_journal.py compact
          python tools/ai_txn.py checkpoint \
            --active-pr 569 \
            --active-branch supervisor/task0092-operator-audit-monitor-20261012 \
            --observed-main 9d2934dac293675c05f9c5a9edf382834019d46e \
            --carrier-title 'feat(phase15): expose redacted read-only synthetic incident monitoring' \
            --completed-pr 568 \
            --completion-sha 9d2934dac293675c05f9c5a9edf382834019d46e \
            --summary 'PR #568 exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance passed and squash merged on 9d2934da. PR #569 stages an operator-only synthetic red-team audit monitor without provider action.' \
            --tests 'PR #568 full exact-head application, PHP floor, PostgreSQL, E2E, Security and Governance PASS; protected main 9d2934da post-merge CI independent and pending. PR #569 exact-head tests pending.' \
            --next 'Certify PR #569 read-only synthetic incident operator monitor, tenant/brand permission checks and hold-preserving audit chain via full exact-head Foundation, PHP 8.3, PostgreSQL, E2E, Security and Governance; guarded merge, then continue TASK-0092 human incident and provider-failure red-team evidence.'
      - name: Validate official continuity and source state
        run: |
          python tools/ai_txn.py validate
          python tools/ai_state.py validate
          python tools/ai_journal.py validate
          python tools/supervisor_contract.py validate
          python tools/supervisor_contract.py validate-main-observation --current-main 9d2934dac293675c05f9c5a9edf382834019d46e
      - name: Export transaction-generated canonical artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          from subprocess import check_output
          import base64
          modified=set(check_output(['git','diff','--name-only'],text=True).splitlines())
          added=set(check_output(['git','ls-files','--others','--exclude-standard','.ai/state/archive'],text=True).splitlines())
          paths=sorted(modified|added)
          required={'.ai/state/CURRENT-STATE.yaml','.ai/state/LAST-CHECKPOINT.md','.ai/state/EXECUTION-JOURNAL.jsonl','.ai/coordination/OPEN-WORK-QUEUE.yaml','.ai/tasks/TASK-0092.yaml'}
          if not required.issubset(paths):
              raise SystemExit(f'Missing generated transaction files: {sorted(required-set(paths))}')
          if any(p not in required and not p.startswith('.ai/state/archive/EXECUTION-JOURNAL-') for p in paths):
              raise SystemExit(f'Unexpected transaction output: {paths}')
          for name in paths:
              print(f'VSN_EVIDENCE_BEGIN::{name}')
              value=base64.b64encode(Path(name).read_bytes()).decode('ascii')
              for i in range(0,len(value),160):
                  print('VSN_EVIDENCE_CHUNK::'+value[i:i+160])
              print(f'VSN_EVIDENCE_END::{name}')
          PY
